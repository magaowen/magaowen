<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台管理 · 软件分享站</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#09090f;--card:rgba(255,255,255,.03);--card2:rgba(255,255,255,.05);
      --text:#d0d0e0;--text2:#8080a0;--border:rgba(255,255,255,.06);
      --accent:#6c5ce7;--accent2:#a29bfe;--green:#00cec9;--red:#ff6b6b;
      --radius:14px;--mono:'SF Mono',Consolas,'Courier New',monospace
    }
    body{
      font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      background:var(--bg);color:var(--text);min-height:100vh;padding:32px 28px;line-height:1.5
    }
    .wrap{max-width:1100px;margin:0 auto}

    /* 登录 */
    .login{
      background:var(--card);border:1px solid var(--border);border-radius:16px;padding:36px;
      max-width:380px;margin:80px auto;backdrop-filter:blur(20px)
    }
    .login h1{font-size:1.3rem;margin-bottom:6px}
    .login .sub{color:var(--text2);font-size:13px;margin-bottom:20px}
    .login input{
      width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--border);
      background:rgba(0,0,0,.4);color:var(--text);font-size:15px;margin:10px 0;outline:none;
      transition:border-color .3s
    }
    .login input:focus{border-color:var(--accent)}
    .btn{
      width:100%;padding:13px;border:none;border-radius:12px;background:var(--accent);
      color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .3s
    }
    .btn:hover{background:#7c6cf7;box-shadow:0 0 20px rgba(108,92,231,.3)}
    .err,.info{font-size:13px;margin-top:8px;min-height:18px}
    .err{color:var(--red)}.info{color:var(--text2)}

    /* 顶部面板 */
    .top-panel{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:20px;margin-bottom:22px}
    .top-panel h1{font-size:1.3rem;font-weight:700;letter-spacing:-.5px}
    .top-panel .sub{color:var(--text2);font-size:12px;margin-top:4px}
    .top-panel .actions{display:flex;gap:10px;flex-wrap:wrap}

    .btn-sm{
      padding:10px 18px;border-radius:10px;border:1px solid var(--border);
      background:var(--card);color:var(--text);font-size:13px;cursor:pointer;
      transition:all .25s;font-family:inherit
    }
    .btn-sm.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn-sm.primary:hover{box-shadow:0 0 16px rgba(108,92,231,.3)}
    .btn-sm.danger{border-color:rgba(255,107,107,.3);color:var(--red)}
    .btn-sm.danger:hover{background:rgba(255,107,107,.15)}
    .btn-sm:hover{filter:brightness(1.15)}

    /* 统计卡片 */
    .stat-grid{
      display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:14px;margin-bottom:26px
    }
    .stat-card{
      background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
      padding:20px;backdrop-filter:blur(20px);position:relative;overflow:hidden;
      transition:all .35s
    }
    .stat-card:hover{border-color:rgba(108,92,231,.25);box-shadow:0 0 24px rgba(108,92,231,.08)}
    .stat-card .st-label{
      font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text2);margin-bottom:10px
    }
    .stat-card .st-value{
      font-size:2rem;font-weight:700;font-family:var(--mono);letter-spacing:-1px
    }
    .stat-card .st-value.hl{color:var(--accent2)}
    .stat-card .st-meta{font-size:11px;color:#555;margin-top:6px;font-family:var(--mono)}
    .stat-card .st-detail{font-size:12px;color:var(--text2);margin-top:8px;line-height:1.6}

    /* 分类标签 */
    .st-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
    .st-tags span{
      font-size:11px;padding:4px 10px;border-radius:6px;
      background:rgba(108,92,231,.15);color:var(--accent2);border:1px solid rgba(108,92,231,.2)
    }

    /* 软件列表 */
    .row{
      background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
      padding:16px 18px;display:flex;align-items:center;gap:14px;margin-bottom:10px;
      transition:all .3s
    }
    .row:hover{border-color:rgba(108,92,231,.3);box-shadow:0 0 16px rgba(108,92,231,.05)}
    .row .ic{
      width:50px;height:50px;border-radius:12px;background:rgba(108,92,231,.15);
      display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0
    }
    .row .ic img{width:100%;height:100%;object-fit:cover}
    .row .nm{flex:1;font-weight:600;min-width:0}
    .row .nm .sub{display:block;color:var(--text2);font-weight:400;font-size:12px;margin-top:2px}
    .row .ops{display:flex;gap:8px;flex-shrink:0}

    /* 空态 */
    .empty-section{text-align:center;padding:60px 20px;color:var(--text2)}
    .empty-section .big{font-size:48px;opacity:.2;margin-bottom:12px}

    /* 弹层 */
    .modal{
      position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-start;
      justify-content:center;padding:40px 16px;overflow:auto;z-index:50;
      backdrop-filter:blur(4px)
    }
    .modal.show{display:flex}
    .panel{
      background:#111122;border:1px solid var(--border);border-radius:16px;padding:28px;
      width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.6)
    }
    .panel h2{font-size:1.15rem;margin-bottom:20px;font-weight:600}
    .fld{margin-bottom:14px;position:relative}
    .fld label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
    .fld input,.fld textarea,.fld select{
      width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);
      background:rgba(0,0,0,.4);color:var(--text);font-size:14px;outline:none;font-family:inherit;
      transition:border-color .3s
    }
    .fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--accent)}
    .fld textarea{resize:vertical;min-height:60px}
    .fld input[type=file]{padding:8px 10px;font-size:13px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .grid2 .fld{margin-bottom:0}
    .grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;align-items:end}
    .grid3 .fld{margin-bottom:0}
    .plat{border-top:1px solid var(--border);margin-top:10px;padding-top:16px}
    .hint{font-size:11px;color:#555;margin-top:5px}

    /* 图标 */
    .ico-row{display:flex;align-items:center;gap:14px;margin-top:8px}
    .ico-preview{
      width:56px;height:56px;border-radius:12px;background:rgba(108,92,231,.15);
      display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:28px
    }
    .ico-preview img{width:100%;height:100%;object-fit:cover}
    .ico-opts label{font-size:12px;color:var(--text2);cursor:pointer;margin-right:12px}

    /* 分类联想 */
    .suggest{
      position:absolute;top:100%;left:0;right:0;background:#111122;border:1px solid var(--border);
      border-radius:10px;max-height:150px;overflow-y:auto;z-index:10;display:none
    }
    .suggest.show{display:block}
    .suggest div{padding:9px 14px;cursor:pointer;font-size:14px;transition:background .2s}
    .suggest div:hover,.suggest div.focus{background:rgba(108,92,231,.25);color:#fff}

    /* 截图 */
    .shots-wrap{display:flex;flex-direction:column;gap:8px;margin-top:8px}
    .shot-row{
      display:grid;grid-template-columns:54px 1fr 100px 30px;gap:8px;align-items:center;
      background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:10px;padding:7px
    }
    .shot-row .thumb{
      width:46px;height:46px;border-radius:8px;background:rgba(255,255,255,.03);overflow:hidden;
      display:flex;align-items:center;justify-content:center;font-size:10px;color:#555
    }
    .shot-row .thumb img{width:100%;height:100%;object-fit:cover}
    .shot-row input[type=text]{padding:8px;font-size:13px}
    .shot-row input[type=file]{font-size:11px}
    .shot-row .star-btn{
      cursor:pointer;background:none;border:1px solid var(--border);color:var(--text2);
      border-radius:7px;padding:6px;font-size:13px;transition:all .2s
    }
    .shot-row .star-btn.on{color:#fbbf24;border-color:#fbbf24;background:rgba(251,191,36,.1)}
    .shot-row .del-btn{
      cursor:pointer;background:rgba(255,107,107,.1);border:none;color:var(--red);
      border-radius:7px;padding:6px;font-size:12px;transition:all .2s
    }
    .shot-row .del-btn:hover{background:rgba(255,107,107,.25)}
    .add-shot-btn{
      margin-top:8px;padding:10px;border:1px dashed var(--border);border-radius:10px;
      background:transparent;color:var(--text2);cursor:pointer;width:100%;font-family:inherit;
      font-size:13px;transition:all .2s
    }
    .add-shot-btn:hover{border-color:var(--accent);color:var(--accent2)}
  </style>
</head>
<body>
<div class="wrap">

  <!-- 登录 -->
  <div class="login" id="loginBox">
    <h1>🔐 管理员登录</h1>
    <div class="sub">访问后台需身份验证</div>
    <input type="password" id="passInput" placeholder="请输入管理密码" autofocus>
    <button class="btn" onclick="doLogin()">登 录</button>
    <div class="err" id="loginErr"></div>
    <div class="info" style="margin-top:12px">默认密码 <code style="color:var(--accent2)">123456</code></div>
  </div>

  <!-- 管理面板 -->
  <div id="adminBox" style="display:none">

    <!-- 顶部 -->
    <div class="top-panel">
      <div>
        <h1>📊 管理控制台</h1>
        <div class="sub">软件分享站 · 数据存储在 Cloudflare KV · 前台实时同步</div>
      </div>
      <div class="actions">
        <button class="btn-sm primary" onclick="openForm()">+ 新增软件</button>
        <button class="btn-sm" onclick="openPass()">修改密码</button>
        <button class="btn-sm danger" onclick="logout()">退出登录</button>
      </div>
    </div>

    <!-- 统计卡片 -->
    <div class="stat-grid" id="statsBox"></div>

    <!-- 软件列表 -->
    <div id="listBox"></div>
  </div>
</div>

<!-- 表单弹层 -->
<div class="modal" id="formModal">
  <div class="panel">
    <h2 id="formTitle">新增软件</h2>
    <input type="hidden" id="f_id">
    <div class="fld"><label>软件名称 *</label><input id="f_name" placeholder="例如：微信"></div>

    <div class="grid2">
      <div class="fld">
        <label>图标</label>
        <div class="ico-row">
          <div class="ico-preview" id="f_icoBox">📦</div>
          <div class="ico-opts">
            <label><input type="radio" name="icoType" value="emoji" checked onchange="toggleIco()"> Emoji</label>
            <label><input type="radio" name="icoType" value="image" onchange="toggleIco()"> 上传</label>
          </div>
        </div>
        <div class="grid2" style="margin-top:6px">
          <input id="f_emoji" placeholder="📦" oninput="updIco()">
          <input type="file" id="f_icoFile" accept="image/*" style="display:none" onchange="upIco(this)">
          <button type="button" class="btn-sm" id="f_icoBtn" onclick="document.getElementById('f_icoFile').click()" style="display:none">选择图片</button>
        </div>
      </div>
      <div class="fld">
        <label>分类</label>
        <input id="f_category" placeholder="社交 / 工具" autocomplete="off" oninput="showSuggest()" onkeydown="navSuggest(event)">
        <div class="suggest" id="f_cat_suggest"></div>
      </div>
    </div>

    <div class="fld"><label>简介</label><textarea id="f_desc" placeholder="一句话描述"></textarea></div>

    <div class="grid2">
      <div class="fld"><label>版本</label><input id="f_version" placeholder="v1.0.0"></div>
      <div class="fld"><label>大小</label>
        <div class="grid3">
          <input id="f_sizeNum" type="number" min="0" step="0.1" placeholder="120">
          <select id="f_sizeUnit"><option>KB</option><option selected>MB</option><option>GB</option></select>
        </div>
      </div>
    </div>
    <div class="fld"><label>更新日期</label><input type="date" id="f_updated"></div>

    <div class="fld">
      <label>截图（★ = 主图）</label>
      <div class="shots-wrap" id="f_shots"></div>
      <button class="add-shot-btn" onclick="addShot()">+ 添加截图</button>
    </div>

    <div class="plat">
      <label style="display:block;font-size:12px;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px">下载地址</label>
      <div class="grid2">
        <div class="fld"><label>🪟 Windows</label><input id="f_pc" placeholder="https://..."></div>
        <div class="fld"><label>🤖 Android</label><input id="f_android" placeholder="https://..."></div>
        <div class="fld"><label>🍎 iOS</label><input id="f_ios" placeholder="https://..."></div>
        <div class="fld"><label>🍏 macOS</label><input id="f_mac" placeholder="https://..."></div>
        <div class="fld"><label>🐧 Linux</label><input id="f_linux" placeholder="https://..."></div>
      </div>
    </div>
    <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:20px">
      <button class="btn-sm" onclick="closeForm()">取消</button>
      <button class="btn-sm primary" onclick="saveForm()">保 存</button>
    </div>
  </div>
</div>

<!-- 改密码 -->
<div class="modal" id="passModal">
  <div class="panel" style="max-width:400px">
    <h2>修改管理密码</h2>
    <div class="fld"><label>新密码</label><input id="p_new" type="password" placeholder="至少 4 位"></div>
    <div class="err" id="passErr"></div>
    <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:16px">
      <button class="btn-sm" onclick="closePass()">取消</button>
      <button class="btn-sm primary" onclick="savePass()">确认</button>
    </div>
  </div>
</div>

<script>
const API="/api/softwares";
function getPass(){return sessionStorage.getItem("admin_pass")||""}
function setPass(p){sessionStorage.setItem("admin_pass",p)}
function esc(s){return String(s==null?"":s).replace(/[<>&"']/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c]))}

// === 登录 ===
async function doLogin(){
  const p=document.getElementById("passInput").value,er=document.getElementById("loginErr");
  er.textContent="";
  try{
    const r=await fetch(API,{method:"PUT",headers:{"content-type":"application/json","x-admin-pass":p},body:JSON.stringify({id:"__probe__",software:{}})});
    if(r.status===401){er.textContent="密码错误";return}
    const d=await r.json().catch(()=>({}));
    if(r.status===200&&(d.ok===true||d.ok===undefined)){setPass(p);initPanel()}else er.textContent="登录失败："+(d.error||"")}
  }catch(e){er.textContent="网络错误："+e.message}
}
function logout(){sessionStorage.removeItem("admin_pass");location.reload()}
document.getElementById("passInput").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});

function initPanel(){
  document.getElementById("loginBox").style.display="none";
  document.getElementById("adminBox").style.display="block";
  loadList();
}

// === 统计卡 ===
function renderStats(list,t0){
  const total=list.length;
  const cats=[...new Set(list.map(s=>s.category).filter(Boolean))];
  const lastUp=list.map(s=>s.updated).filter(Boolean).sort().reverse()[0]||"—";
  const t1=Date.now();
  const latency=t0&&((t1-t0)/1000).toFixed(2)+"s"||"—";
  const kvEst=(JSON.stringify(list).length/1024).toFixed(1)+"kB";
  const dlCount=list.reduce((a,s)=>a+Object.keys(s.downloads||{}).length,0);

  document.getElementById("statsBox").innerHTML=`
    <div class="stat-card">
      <div class="st-label">软件总数</div>
      <div class="st-value hl">${total}</div>
    </div>
    <div class="stat-card">
      <div class="st-label">分类</div>
      <div class="st-value hl" style="font-size:1.4rem">${cats.length}</div>
      <div class="st-tags">${cats.map(c=>`<span>${esc(c)}</span>`).join("")||'<span style="color:#555">暂无</span>'}</div>
    </div>
    <div class="stat-card">
      <div class="st-label">系统信息</div>
      <div class="st-detail">
        <div>KV 存储占用：<code style="color:var(--accent2)">${kvEst}</code></div>
        <div>下载链接数：<code>${dlCount}</code></div>
        <div>最近更新：<code>${lastUp}</code></div>
        <div>API 延迟：<code style="color:var(--green)">${latency}</code></div>
      </div>
    </div>
    <div class="stat-card">
      <div class="st-label">部署信息</div>
      <div class="st-detail">
        <div>平台：<code>Cloudflare Pages</code></div>
        <div>域名：<code style="color:var(--accent2)">soft-share.pages.dev</code></div>
        <div>KV 命名空间：<code>SOFTDATA</code></div>
        <div>部署方式：<code>Git (GitHub → Pages)</code></div>
      </div>
    </div>`;
}

// === 列表 ===
async function loadList(){
  const box=document.getElementById("listBox");
  box.innerHTML='<div class="empty-section"><div class="big">⏳</div><div class="st-label">加载中...</div></div>';
  const t0=Date.now();
  try{
    const r=await fetch(API);const list=await r.json();
    renderStats(list,t0);
    if(!list.length){box.innerHTML='<div class="empty-section"><div class="big">📦</div><div class="st-label">还没有软件</div><div style="color:#555;font-size:13px;margin-top:6px">点顶部「新增软件」开始添加</div></div>';return}
    box.innerHTML=list.map(s=>`
      <div class="row">
        <div class="ic">${renderIco(s.icon)}</div>
        <div class="nm">${esc(s.name)}<span class="sub">${esc(s.category||"—")} · ${esc(s.version||"—")} · ${esc(s.size||"—")} · ${Object.keys(s.downloads||{}).length} 个平台</span></div>
        <div class="ops">
          <button class="btn-sm" onclick="openForm('${s.id}')">编辑</button>
          <button class="btn-sm danger" onclick="delItem('${s.id}')">删除</button>
        </div>
      </div>`).join("");
  }catch(e){box.innerHTML='<div class="empty-section"><div class="big">⚠️</div><div class="st-label">加载失败</div><div class="err" style="margin-top:6px">'+e.message+'</div></div>'}
}

function renderIco(s){
  if(!s)return "📦";
  if(s.startsWith("data:image/"))return `<img src="${s}">`;
  return esc(s);
}

// === 图标 ===
function toggleIco(){
  const t=document.querySelector('input[name="icoType"]:checked').value;
  document.getElementById("f_emoji").style.display=t==="emoji"?"":"none";
  document.getElementById("f_icoBtn").style.display=t==="image"?"":"none";
  updIco();
}
function updIco(){
  const b=document.getElementById("f_icoBox"),t=document.querySelector('input[name="icoType"]:checked').value;
  b.innerHTML=t==="emoji"?esc(document.getElementById("f_emoji").value||"📦"):(b._b64?`<img src="${b._b64}">`:"📦");
}
function upIco(inp){
  const f=inp.files[0];if(!f)return;
  compress(f,64,64,64*1024).then(b64=>{
    const b=document.getElementById("f_icoBox");b._b64=b64;b.innerHTML=`<img src="${b64}">`;
  }).catch(e=>alert("图标处理失败："+e.message));
}

// === 截图 ===
let shotsState=[];
function addShot(url="",isMain=false){shotsState.push({url,isMain});renderShots()}
function renderShots(){
  const b=document.getElementById("f_shots");
  if(!shotsState.length){b.innerHTML='<div class="hint">还没有截图，点下方按钮添加</div>';return}
  b.innerHTML=shotsState.map((s,i)=>`
    <div class="shot-row">
      <div class="thumb">${s.url&&/^(data:|https?:)/i.test(s.url)?`<img src="${s.url}">`:"?"}</div>
      <input type="text" placeholder="https:// 图片直链" value="${esc(s.url.startsWith("data:")?"[已上传]":s.url)}" onchange="updShot(${i},'url',this.value)">
      <input type="file" accept="image/*" onchange="upShot(${i},this)">
      <button class="star-btn ${s.isMain?'on':''}" onclick="setMain(${i})" title="主图">★</button>
      <button class="del-btn" onclick="delShot(${i})">×</button>
    </div>`).join("");
}
function updShot(i,k,v){shotsState[i][k]=v.trim();renderShots()}
function setMain(i){shotsState.forEach((s,j)=>s.isMain=j===i);renderShots()}
function delShot(i){shotsState.splice(i,1);renderShots()}
function upShot(i,inp){
  const f=inp.files[0];if(!f)return;
  compress(f,800,800,200*1024).then(b64=>{shotsState[i].url=b64;renderShots()}).catch(e=>alert("截图处理失败："+e.message));
}

function compress(file,mw,mh,mx){
  return new Promise((ok,no)=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>mw){h=h*mw/w;w=mw}if(h>mh){w=w*mh/h;h=mh}
        const c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        let q=.85,b64;(function tryQ(){b64=c.toDataURL("image/jpeg",q);if(b64.length*3/4>mx&&q>.3){q-=.1;tryQ()}else ok(b64)})();
      };img.onerror=()=>no(new Error("格式不支持"));img.src=e.target.result;
    };r.onerror=()=>no(new Error("读取失败"));r.readAsDataURL(file);
  });
}

// === 分类联想 ===
const CK="site_cats_v2";
function loadCats(){try{return JSON.parse(localStorage.getItem(CK)||"[]")}catch(e){return[]}}
function saveCat(c){if(!c)return;const a=loadCats();if(!a.includes(c)){a.unshift(c);localStorage.setItem(CK,JSON.stringify(a.slice(0,30)))}}
function showSuggest(){
  const inp=document.getElementById("f_category"),kw=inp.value.trim().toLowerCase();
  const cs=loadCats().filter(c=>!kw||c.toLowerCase().includes(kw));
  const b=document.getElementById("f_cat_suggest");
  if(!cs.length){b.classList.remove("show");return}
  b.innerHTML=cs.map(c=>`<div data-c="${esc(c)}">${esc(c)}</div>`).join("");
  b.classList.add("show");
  [...b.children].forEach((d,i)=>{d.addEventListener("mousedown",()=>{inp.value=d.dataset.c;b.classList.remove("show")})});
}
function navSuggest(e){
  const b=document.getElementById("f_cat_suggest");if(!b.classList.contains("show"))return;
  if(e.key==="Escape"){b.classList.remove("show");return}
  if(e.key==="Enter"){const s=b.querySelector(".focus");if(s){e.preventDefault();document.getElementById("f_category").value=s.dataset.c;b.classList.remove("show")}}
}
document.addEventListener("click",e=>{if(!e.target.closest("#f_category"))document.getElementById("f_cat_suggest").classList.remove("show")});

// === 表单 ===
function today(){return new Date().toISOString().slice(0,10)}
function openForm(id){
  document.getElementById("formTitle").textContent=id?"编辑软件":"新增软件";
  document.getElementById("f_id").value=id||"";
  document.querySelector('input[name="icoType"][value="emoji"]').checked=true;
  document.getElementById("f_icoFile").value="";
  document.getElementById("f_icoBox")._b64="";
  document.getElementById("formModal").classList.add("show");
  if(id){fetch(API).then(r=>r.json()).then(list=>{
    const s=list.find(x=>x.id===id);if(!s)return;
    const b=document.getElementById("f_icoBox");
    if(s.icon&&s.icon.startsWith("data:image/")){document.querySelector('input[name="icoType"][value="image"]').checked=true;b._b64=s.icon}
    else document.getElementById("f_emoji").value=s.icon||"";
    toggleIco();updIco();
    document.getElementById("f_name").value=s.name||"";
    document.getElementById("f_category").value=s.category||"";
    document.getElementById("f_desc").value=s.desc||"";
    document.getElementById("f_version").value=s.version||"";
    const m=String(s.size||"").match(/^([\d.]+)\s*([KMG]B)?$/i);
    if(m){document.getElementById("f_sizeNum").value=m[1];document.getElementById("f_sizeUnit").value=(m[2]||"MB").toUpperCase()}
    else document.getElementById("f_sizeNum").value="";
    document.getElementById("f_updated").value=s.updated||today();
    ["pc","android","ios","mac","linux"].forEach(k=>document.getElementById("f_"+k).value=(s.downloads&&s.downloads[k])||"");
    shotsState=(s.screenshots||[]).map(u=>({url:u,isMain:false}));
    if(s.mainShot){const idx=shotsState.findIndex(x=>x.url===s.mainShot);if(idx>=0)shotsState[idx].isMain=true}
    renderShots();
  })}else{
    ["f_name","f_category","f_desc","f_version","f_sizeNum"].forEach(k=>document.getElementById(k).value="");
    document.getElementById("f_emoji").value="";document.getElementById("f_updated").value=today();
    shotsState=[];addShot();renderShots();toggleIco();
  }
}
function closeForm(){document.getElementById("formModal").classList.remove("show")}

async function saveForm(){
  const id=document.getElementById("f_id").value;
  const it=document.querySelector('input[name="icoType"]:checked').value;
  let icon=it==="emoji"?document.getElementById("f_emoji").value.trim()||"📦":document.getElementById("f_icoBox")._b64||"📦";
  const sn=document.getElementById("f_sizeNum").value,su=document.getElementById("f_sizeUnit").value;
  const size=sn?`${sn} ${su}`:"";
  const dl={};["pc","android","ios","mac","linux"].forEach(k=>{const v=document.getElementById("f_"+k).value.trim();if(v)dl[k]=v});
  const cat=document.getElementById("f_category").value.trim();if(cat)saveCat(cat);
  const valid=shotsState.filter(s=>s.url&&!s.url.startsWith("[已上传]")&&s.url.trim()!=="");
  const mainShot=valid.find(s=>s.isMain)?.url||null;
  const sw={
    id:id||("s"+Date.now()),name:document.getElementById("f_name").value.trim()||"未命名",
    icon,desc:document.getElementById("f_desc").value.trim(),category:cat,
    version:document.getElementById("f_version").value.trim(),size,
    updated:document.getElementById("f_updated").value||today(),
    screenshots:valid.map(s=>s.url),mainShot,downloads:dl
  };
  const method=id?"PUT":"POST",body=id?{id,software:sw}:{software:sw};
  try{
    const r=await fetch(API,{method,headers:{"content-type":"application/json","x-admin-pass":getPass()},body:JSON.stringify(body)});
    const res=await r.json();
    if(res.ok){closeForm();loadList()}else alert("保存失败："+(res.error||""))
  }catch(e){alert("网络错误："+e.message)}
}

async function delItem(id){if(!confirm("删除该软件？不可恢复！"))return;
  try{const r=await fetch(API,{method:"DELETE",headers:{"content-type":"application/json","x-admin-pass":getPass()},body:JSON.stringify({id})});
    const res=await r.json();if(res.ok)loadList();else alert("删除失败："+(res.error||""))
  }catch(e){alert("网络错误："+e.message)}}

// === 改密码 ===
function openPass(){document.getElementById("passErr").textContent="";document.getElementById("p_new").value="";document.getElementById("passModal").classList.add("show")}
function closePass(){document.getElementById("passModal").classList.remove("show")}
async function savePass(){
  const np=document.getElementById("p_new").value;
  if(np.length<4){document.getElementById("passErr").textContent="至少 4 位";return}
  try{
    const r=await fetch(API,{method:"PUT",headers:{"content-type":"application/json","x-admin-pass":getPass()},body:JSON.stringify({action:"changepass",newpass:np})});
    const res=await r.json();
    if(res.ok){setPass(np);closePass();alert("密码已修改 ✓")}
    else document.getElementById("passErr").textContent=res.error||"修改失败"
  }catch(e){document.getElementById("passErr").textContent="网络错误："+e.message}
}

if(getPass()){initPanel()}
</script>

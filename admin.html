<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>平台后台 · 全国宠物交易</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#fdf8f4;--card:#fff;--text:#2d2d2d;--text2:#888;--border:#f0e8e0;--accent:#e8784a;--accent2:#f5a623;--green:#4caf50;--red:#f44336;--rad:14px;--input-bg:#fff;--mono:'SF Mono',Consolas,monospace}
    [data-theme="dark"]{--bg:#1a1410;--card:rgba(255,255,255,.04);--text:#e8d5c8;--text2:#9a8a7a;--border:rgba(255,255,255,.07);--accent:#f09060;--input-bg:rgba(0,0,0,.4)}
    body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px 20px;transition:background .4s}
    .theme-toggle{position:fixed;top:16px;right:20px;z-index:100;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
    .wrap{max-width:1100px;margin:0 auto}
    .login{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;max-width:360px;margin:60px auto}
    .login h1{font-size:1.2rem;margin-bottom:6px}.login .sub{color:var(--text2);font-size:13px;margin-bottom:18px}
    .login input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:15px;margin:8px 0;outline:none}
    .login input:focus{border-color:var(--accent)}
    .btn{width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}.btn:hover{opacity:.9}
    .err{color:var(--red);font-size:13px;margin-top:8px;min-height:18px}.info{color:var(--text2);font-size:13px}
    .top-panel{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:20px}
    .top-panel h1{font-size:1.2rem}.top-panel .sub{color:var(--text2);font-size:12px;margin-top:4px}
    .top-panel .actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn-sm{padding:9px 14px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;cursor:pointer;transition:all .2s;font-family:inherit}
    .btn-sm.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn-sm.danger{border-color:rgba(244,67,54,.3);color:var(--red)}.btn-sm.danger:hover{background:rgba(244,67,54,.1)}
    .btn-sm.ok{background:var(--green);border-color:var(--green);color:#fff}
    .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
    .stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:16px}
    .stat-card .st-label{font-size:11px;letter-spacing:1px;color:var(--text2);margin-bottom:8px}
    .stat-card .st-value{font-size:1.8rem;font-weight:700;font-family:var(--mono);color:var(--accent)}
    .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
    .tab{padding:9px 16px;border-radius:20px;cursor:pointer;background:var(--card);border:1px solid var(--border);color:var(--text2);font-size:14px;font-weight:600}
    .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .tab .cnt{font-size:11px;opacity:.8;margin-left:3px}
    .row{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px;cursor:pointer;transition:all .2s}
    .row:hover{border-color:var(--accent)}
    .row .ic{width:50px;height:50px;border-radius:10px;background:var(--bg);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
    .row .ic img{width:100%;height:100%;object-fit:cover}
    .row .nm{flex:1;font-weight:600;min-width:0}
    .row .nm .sub{display:block;color:var(--text2);font-weight:400;font-size:12px;margin-top:2px}
    .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;color:#fff;margin-left:6px}
    .row .ops{display:flex;gap:6px;flex-shrink:0}
    .empty-s{text-align:center;padding:50px;color:var(--text2)}
    .detail{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;margin:-4px 0 8px}
    .detail .gallery{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .detail .gallery img{width:120px;height:90px;object-fit:cover;border-radius:8px}
    .detail .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:12px}
    .detail .kv div{background:var(--card);padding:8px 10px;border-radius:8px;font-size:13px}
    .detail .kv div b{color:var(--text2);font-weight:400;margin-right:6px}
    .detail .acts{display:flex;gap:8px;flex-wrap:wrap}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
    .modal.show{display:flex}
    .panel{background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:460px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
    [data-theme="dark"] .panel{background:#1a1410}
    .panel h2{font-size:1.1rem;margin-bottom:16px}
    .fld{margin-bottom:12px}.fld label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
    .fld input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;outline:none;font-family:inherit}
    .fld input:focus{border-color:var(--accent)}
    .cat-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .cat-chip{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:7px;background:rgba(232,120,74,.1);color:var(--accent);border:1px solid rgba(232,120,74,.2);font-size:12px}
    .cat-chip .rm{cursor:pointer;color:var(--red);font-size:15px}
    .user-row{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:var(--card)}
    .user-row .u-info{flex:1}.user-row .u-info .sub{font-size:12px;color:var(--text2);margin-top:2px}
    .user-row .ops{display:flex;gap:6px}
    @media(max-width:640px){body{padding:16px 10px}}
  </style>
</head>
<body>
<button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌓</button>
<div class="wrap">

  <div class="login" id="loginBox">
    <h1>🛡️ 平台管理后台</h1><div class="sub">全国宠物交易 · 审核 / 用户 / 统计</div>
    <input type="text" id="phoneInput" placeholder="管理员账号（admin）" autocomplete="username">
    <input type="password" id="passInput" placeholder="密码" autocomplete="current-password">
    <button class="btn" onclick="doLogin()">登 录</button>
    <div class="err" id="loginErr"></div>
    <div class="info" style="margin-top:10px">默认账号 <code style="color:var(--accent)">admin</code> / 密码 <code style="color:var(--accent)">123456</code> ｜ <a href="/" style="color:var(--accent)">返回首页</a></div>
  </div>

  <div id="adminBox" style="display:none">
    <div class="top-panel">
      <div><h1>🛡️ 平台管理后台</h1><div class="sub" id="whoSub">全国宠物交易 · 审核 / 用户 / 统计</div></div>
      <div class="actions">
        <button class="btn-sm" onclick="openCats()">🏷 分类管理</button>
        <button class="btn-sm danger" onclick="doLogout()">退出</button>
      </div>
    </div>
    <div class="stat-grid" id="statsBox"></div>
    <div class="tabs" id="tabsBox"></div>
    <div id="listBox"></div>
  </div>
</div>

<div class="modal" id="catModal"><div class="panel">
  <h2>🏷 分类管理</h2>
  <div style="display:flex;gap:8px"><input id="newCat" placeholder="新分类名称"><button class="btn-sm primary" onclick="addCat()">添加</button></div>
  <div class="cat-chips" id="catList"></div>
  <div style="text-align:right;margin-top:12px"><button class="btn-sm" onclick="closeCats()">关闭</button></div>
</div></div>

<script src="./common.js"></script>
<script>
let stats={pending:0,active:0,rejected:0,offline:0,wants:0,users:0,admins:0,todayNew:0};
let curStatus="pending";
let categories=[];
let expanded=null;
let allPets=[];

// 若已登录且是管理员，直接进入
(async function(){
  const u=getUser();
  if(u && u.type==="admin"){ try{ const d=await apiGet("/api/admin/stats"); if(d.ok){ initPanel(); return; } }catch(e){} }
  document.getElementById("loginBox").style.display="block";
})();

async function doLogin(){
  const phone=document.getElementById("phoneInput").value.trim();
  const pw=document.getElementById("passInput").value;
  const err=document.getElementById("loginErr");
  if(!phone||!pw){err.textContent="请填写账号和密码";return}
  err.textContent="验证中...";
  const d=await apiPost("/api/auth/login",{phone,password:pw});
  if(d.ok && d.user.type==="admin"){ setAuth(d.token,d.user); initPanel(); }
  else if(d.ok){ err.textContent="该账号不是管理员"; }
  else err.textContent=d.error||"登录失败";
}

function initPanel(){
  document.getElementById("loginBox").style.display="none";
  document.getElementById("adminBox").style.display="block";
  document.getElementById("whoSub").textContent="管理员："+(getUser().name||"")+" · 全国宠物交易";
  loadAll();
}
function doLogout(){ clearAuth(); location.reload(); }

async function loadAll(){
  const [s,c]=await Promise.all([apiGet("/api/admin/stats"), apiGet("/api/categories")]);
  if(s.ok) stats=s.stats;
  categories=Array.isArray(c)?c:[];
  renderStats(); renderTabs(); await loadList();
}
function renderStats(){
  document.getElementById("statsBox").innerHTML=`
    <div class="stat-card"><div class="st-label">待审核</div><div class="st-value" style="color:var(--accent2)">${stats.pending}</div></div>
    <div class="stat-card"><div class="st-label">已上架</div><div class="st-value" style="color:var(--green)">${stats.active}</div></div>
    <div class="stat-card"><div class="st-label">求购中</div><div class="st-value" style="color:var(--accent)">${stats.wants}</div></div>
    <div class="stat-card"><div class="st-label">今日新增</div><div class="st-value">${stats.todayNew||0}</div></div>
    <div class="stat-card"><div class="st-label">注册用户</div><div class="st-value" style="color:var(--accent)">${stats.users}</div></div>
    <div class="stat-card"><div class="st-label">管理员</div><div class="st-value" style="font-size:1.2rem">${stats.admins||0}</div></div>`;
}
function renderTabs(){
  const tabs=[["pending","待审核"],["active","已上架"],["rejected","已拒绝"],["offline","已下架"],["all","全部"],["want","求购"],["users","用户管理"]];
  const cnt={pending:stats.pending,active:stats.active,rejected:stats.rejected,offline:stats.offline,want:stats.wants};
  document.getElementById("tabsBox").innerHTML=tabs.map(([k,label])=>`<div class="tab ${k===curStatus?'active':''}" onclick="switchTab('${k}')">${label}${cnt[k]!=null?`<span class="cnt">${cnt[k]}</span>`:""}</div>`).join("");
}
function switchTab(t){ curStatus=t; expanded=null; renderTabs(); loadList(); }

async function loadList(){
  const box=document.getElementById("listBox");
  if(curStatus==="users"){ return renderUsers(); }
  box.innerHTML='<div class="empty-s">⏳ 加载中...</div>';
  const url = curStatus==="want" ? "/api/pets?type=want&status=all" : "/api/pets?status="+curStatus;
  const d=await apiGet(url);
  const list=d.pets||[];
  allPets=list;
  if(!list.length){ box.innerHTML='<div class="empty-s"><div style="font-size:40px;opacity:.3">🐾</div>暂无数据</div>'; return; }
  box.innerHTML=list.map(p=>`<div>
    <div class="row" onclick="toggleDetail('${p.id}')">
      <div class="ic">${(p.screenshots&&p.screenshots[0])?`<img src="${p.screenshots[0]}">`:"🐾"}</div>
      <div class="nm">${esc(p.name||"未命名")}<span class="badge" style="background:${STATUS_COLOR[p.status]||'#888'}">${STATUS_LABEL[p.status]||p.status}</span><span class="sub">${esc([p.province,p.city].filter(Boolean).join(" "))||"未知城市"} · ${esc(p.category||"—")} · ${esc(p.breed||"—")} · ${p.price?"¥"+esc(p.price):"免费"} · 发布者:${esc(p.sellerPhone||"—")}</span></div>
      <div class="ops"><button class="btn-sm primary" onclick="event.stopPropagation();approve('${p.id}')">通过</button><button class="btn-sm danger" onclick="event.stopPropagation();reject('${p.id}')">拒绝</button></div>
    </div>
    <div id="d_${p.id}"></div>
  </div>`).join("");
}

function toggleDetail(id){
  expanded = expanded===id ? null : id;
  document.querySelectorAll('[id^="d_"]').forEach(el=>el.innerHTML="");
  if(!expanded) return;
  const box=document.getElementById("d_"+id);
  const p = allPets.find(x=>x.id===id);
  if(!p) return;
  const shots=(p.screenshots||[]);
  const kv=[["标题",p.name],["省份",p.province],["城市",p.city],["区县",p.district],["分类",p.category],["品种",p.breed],["年龄",p.age],["性别",p.gender],["疫苗",p.vaccine],["价格",p.price?"¥"+p.price:"免费"],["联系方式",p.contact],["浏览",p.views],["发布",p.updatedAt?p.updatedAt.slice(0,10):""]].filter(a=>a[1]!==undefined&&a[1]!==null&&a[1]!=="");
  box.innerHTML=`<div class="detail">
    <div class="gallery">${shots.length?shots.map(s=>`<img src="${s}" onerror="this.style.display='none'">`).join(""):'<span style="color:var(--text2)">无图片</span>'}</div>
    <div class="kv">${kv.map(([k,v])=>`<div><b>${k}</b>${esc(v)}</div>`).join("")}</div>
    ${p.desc?`<div style="font-size:13px;color:var(--text);line-height:1.7;margin-bottom:12px">${esc(p.desc)}</div>`:""}
    ${p.status==="rejected"?`<div style="color:var(--red);font-size:13px;margin-bottom:12px">拒绝原因：${esc(p.rejectReason||"未说明")}</div>`:""}
    <div class="acts">
      ${p.status!=="active"?`<button class="btn-sm ok" onclick="approve('${p.id}')">✅ 通过上架</button>`:""}
      ${p.status!=="rejected"?`<button class="btn-sm danger" onclick="reject('${p.id}')">❌ 拒绝</button>`:""}
      ${p.status==="active"?`<button class="btn-sm" onclick="unpublish('${p.id}')">⤵ 下架</button>`:""}
      <button class="btn-sm danger" onclick="del('${p.id}')">🗑 删除</button>
    </div></div>`;
}

async function approve(id){ const d=await apiPost("/api/pets/"+encodeURIComponent(id)+"/approve",{}); afterAct(d,"已通过上架"); }
async function reject(id){ const reason=prompt("拒绝原因（会展示给卖家）：","信息不实/图片不符"); if(reason===null)return; const d=await apiPost("/api/pets/"+encodeURIComponent(id)+"/reject",{reason}); afterAct(d,"已拒绝"); }
async function unpublish(id){ if(!confirm("确认下架？前台将不再展示"))return; const d=await apiPost("/api/pets/"+encodeURIComponent(id)+"/unpublish",{}); afterAct(d,"已下架"); }
async function del(id){ if(!confirm("确认删除？不可恢复"))return; const d=await apiDel("/api/pets/"+encodeURIComponent(id)); afterAct(d,"已删除",true); }
function afterAct(d,msg,reloadList){
  if(!d.ok){ alert(d.error||"操作失败"); return; }
  alert(msg); expanded=null; loadAll();
}

// 用户管理
async function renderUsers(){
  const box=document.getElementById("listBox");
  box.innerHTML='<div class="empty-s">⏳ 加载中...</div>';
  const d=await apiGet("/api/admin/users");
  const list=d.users||[];
  if(!list.length){ box.innerHTML='<div class="empty-s">暂无用户</div>'; return; }
  box.innerHTML=list.map(u=>{
    const reg=u.createdAt?u.createdAt.replace("T"," ").slice(0,19):"";
    const roleBadge = u.type==='admin'?'<span class="badge" style="background:#888">管理员</span>':'<span class="badge" style="background:var(--green)">会员</span>';
    const banned = u.status==='banned'?'<span class="badge" style="background:var(--red)">已封禁</span>':'';
    let ops;
    if(u.type==='admin'){
      ops='<button class="btn-sm" onclick="setUser(\''+u.id+'\',\'demote\')">取消管理员</button>';
    } else {
      const banBtn = u.status==='banned'
        ? '<button class="btn-sm primary" onclick="setUser(\''+u.id+'\',\'unban\')">解封</button>'
        : '<button class="btn-sm danger" onclick="setUser(\''+u.id+'\',\'ban\')">封禁</button>';
      ops=banBtn+'<button class="btn-sm" onclick="setUser(\''+u.id+'\',\'promote\')">设为管理员</button>';
    }
    return '<div class="user-row"><div class="u-info"><b>'+esc(u.name||u.phone)+'</b> '+roleBadge+' '+banned+'<div class="sub">📱 '+esc(u.phone)+' · 🕒 注册 '+reg+' · 📦 发帖 '+(u.petCount||0)+'</div></div><div class="ops">'+ops+'</div></div>';
  }).join("");
}
async function setUser(id,action){
  if((action==="ban"||action==="promote"||action==="demote") && !confirm("确认执行该操作？")) return;
  const d=await apiPost("/api/admin/users",{userId:id,action});
  if(d.ok) renderUsers(); else alert(d.error);
}

// 分类管理
function openCats(){ document.getElementById("catModal").classList.add("show"); renderCats(); }
function closeCats(){ document.getElementById("catModal").classList.remove("show"); }
function renderCats(){ document.getElementById("catList").innerHTML=categories.map(c=>`<div class="cat-chip">${esc(c)}<span class="rm" onclick="delCat('${esc(c)}')">×</span></div>`).join("")||'<div style="color:var(--text2);font-size:13px">暂无</div>'; }
async function addCat(){ const n=document.getElementById("newCat").value.trim(); if(!n)return; const d=await apiPost("/api/categories",{name:n}); if(d.ok){categories=d.cats;renderCats();document.getElementById("newCat").value="";} else alert(d.error); }
async function delCat(n){ if(!confirm("删除「"+n+"」？"))return; const r=await fetch("/api/categories",{method:"DELETE",headers:{"content-type":"application/json","authorization":"Bearer "+getToken()},body:JSON.stringify({name:n})}); const dd=await r.json().catch(()=>({})); if(dd.ok){categories=dd.cats;renderCats();} else alert(dd.error||"删除失败"); }

document.getElementById("passInput").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});
</script>
</body>
</html>

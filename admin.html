<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台管理 - 软件分享站</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 24px; }
    .wrap { max-width: 980px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    .sub { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }

    /* 登录 */
    .login { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 28px; max-width: 360px; margin: 60px auto; }
    .login input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #334155;
      background: #0f172a; color: #e2e8f0; font-size: 15px; margin: 10px 0; outline: none; }
    .login input:focus { border-color: #3b82f6; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; background: #3b82f6; color: #fff;
      font-size: 15px; font-weight: 600; cursor: pointer; transition: .2s; }
    .btn:hover { background: #2563eb; }
    .err { color: #f87171; font-size: 13px; margin-top: 8px; min-height: 18px; }

    /* 顶部统计卡 */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px; margin-bottom: 18px; }
    .stat { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px; }
    .stat .lbl { font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
    .stat .val { font-size: 1.5rem; font-weight: 700; color: #3b82f6; }
    .stat .ext { font-size: 11px; color: #64748b; margin-top: 4px; }
    .cats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .cats span { background: #0f172a; border: 1px solid #334155; border-radius: 6px;
      padding: 3px 8px; font-size: 12px; color: #cbd5e1; }

    /* 工具条 */
    .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .bar .actions { display: flex; gap: 10px; }
    .btn-sm { padding: 9px 16px; border-radius: 9px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0;
      font-size: 13px; cursor: pointer; }
    .btn-sm.primary { background: #3b82f6; border-color: #3b82f6; }
    .btn-sm.danger { background: #7f1d1d; border-color: #991b1b; }
    .btn-sm:hover { filter: brightness(1.1); }

    /* 列表 */
    .row { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px 16px;
      display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .row .ic { font-size: 26px; width: 48px; height: 48px; border-radius: 10px; background: #eff6ff;
      display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
    .row .ic img { width: 100%; height: 100%; object-fit: cover; }
    .row .nm { flex: 1; font-weight: 600; min-width: 0; }
    .row .nm small { display: block; color: #94a3b8; font-weight: 400; font-size: 12px; }
    .row .ops { display: flex; gap: 8px; flex-shrink: 0; }

    /* 表单弹层 */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-start;
      justify-content: center; padding: 30px 16px; overflow: auto; z-index: 50; }
    .modal.show { display: flex; }
    .panel { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 24px;
      width: 100%; max-width: 700px; }
    .panel h2 { font-size: 1.2rem; margin-bottom: 16px; }
    .fld { margin-bottom: 14px; position: relative; }
    .fld label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
    .fld input, .fld textarea, .fld select { width: 100%; padding: 10px 12px; border-radius: 9px;
      border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px;
      outline: none; font-family: inherit; }
    .fld input:focus, .fld textarea:focus, .fld select:focus { border-color: #3b82f6; }
    .fld textarea { resize: vertical; min-height: 60px; }
    .fld input[type="file"] { padding: 8px 10px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid2 .fld { margin-bottom: 0; }
    .grid3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; align-items: end; }
    .grid3 .fld { margin-bottom: 0; }
    .plat { border-top: 1px solid #334155; margin-top: 8px; padding-top: 14px; }
    .plat .ttl { font-size: 13px; color: #94a3b8; margin-bottom: 10px; }
    .hint { font-size: 12px; color: #64748b; margin-top: 4px; }
    .ico-preview { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
    .ico-preview .box { width: 56px; height: 56px; border-radius: 12px; background: #eff6ff;
      display: flex; align-items: center; justify-content: center; font-size: 28px; overflow: hidden; }
    .ico-preview .box img { width: 100%; height: 100%; object-fit: cover; }
    .ico-preview .opts label { font-size: 12px; color: #94a3b8; cursor: pointer; }

    /* 分类联想 */
    .suggest { position: absolute; top: 100%; left: 0; right: 0; background: #0f172a;
      border: 1px solid #334155; border-radius: 8px; max-height: 160px; overflow-y: auto;
      z-index: 10; display: none; }
    .suggest.show { display: block; }
    .suggest div { padding: 8px 12px; cursor: pointer; font-size: 14px; }
    .suggest div:hover, .suggest div.focus { background: #3b82f6; color: #fff; }

    /* 截图 */
    .shots { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
    .shot-item { display: grid; grid-template-columns: 56px 1fr 100px 28px; gap: 8px; align-items: center;
      background: #0f172a; border: 1px solid #334155; border-radius: 9px; padding: 6px; }
    .shot-item .thumb { width: 48px; height: 48px; border-radius: 6px; background: #1e293b;
      display: flex; align-items: center; justify-content: center; overflow: hidden; color: #475569; font-size: 11px; }
    .shot-item .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .shot-item input[type="text"] { padding: 8px 10px; font-size: 13px; }
    .shot-item input[type="file"] { padding: 4px; font-size: 11px; }
    .shot-item .star { cursor: pointer; background: none; border: 1px solid #334155;
      color: #94a3b8; border-radius: 6px; padding: 6px; font-size: 13px; }
    .shot-item .star.on { color: #fbbf24; border-color: #fbbf24; background: #422006; }
    .shot-item .del { cursor: pointer; background: #7f1d1d; border: none; color: #fff;
      border-radius: 6px; padding: 6px; font-size: 12px; }
    .add-shot { margin-top: 8px; padding: 9px; border: 1px dashed #334155; border-radius: 9px;
      background: transparent; color: #94a3b8; cursor: pointer; width: 100%; }
    .add-shot:hover { border-color: #3b82f6; color: #3b82f6; }
  </style>
</head>
<body>
<div class="wrap">

  <!-- 登录 -->
  <div class="login" id="loginBox">
    <h1>🔐 后台登录</h1>
    <div class="sub">默认密码 123456，登录后可在底部修改</div>
    <input type="password" id="passInput" placeholder="请输入管理密码" autofocus>
    <button class="btn" onclick="doLogin()">登录</button>
    <div class="err" id="loginErr"></div>
  </div>

  <!-- 管理区 -->
  <div id="adminBox" style="display:none">

    <!-- 顶部统计 -->
    <div class="stats" id="statsBox"></div>

    <div class="bar">
      <div>
        <h1>🛠️ 软件管理</h1>
        <div class="sub">数据实时存到云端 KV，前台自动更新</div>
      </div>
      <div class="actions">
        <button class="btn-sm primary" onclick="openForm()">+ 新增软件</button>
        <button class="btn-sm" onclick="openPass()">改密码</button>
        <button class="btn-sm danger" onclick="logout()">退出</button>
      </div>
    </div>
    <div id="listBox"></div>
  </div>

</div>

<!-- 新增/编辑软件弹层 -->
<div class="modal" id="formModal">
  <div class="panel">
    <h2 id="formTitle">新增软件</h2>
    <input type="hidden" id="f_id">

    <!-- 软件名 -->
    <div class="fld">
      <label>软件名称 *</label>
      <input id="f_name" placeholder="例如：微信">
    </div>

    <!-- 图标（emoji 或 上传图片） -->
    <div class="grid2">
      <div class="fld">
        <label>图标</label>
        <div class="ico-preview">
          <div class="box" id="f_icoBox">📦</div>
          <div class="opts">
            <label style="display:block;margin-bottom:6px"><input type="radio" name="icoType" value="emoji" checked onchange="toggleIcoType()"> Emoji</label>
            <label><input type="radio" name="icoType" value="image" onchange="toggleIcoType()"> 上传图片</label>
          </div>
        </div>
        <div class="grid2" style="margin-top:8px">
          <input id="f_icoEmoji" placeholder="📦 或留空" oninput="updateIcoPreview()">
          <input type="file" id="f_icoFile" accept="image/*" style="display:none" onchange="uploadIco(this)">
          <button type="button" class="btn-sm" id="f_icoBtn" onclick="document.getElementById('f_icoFile').click()" style="display:none">选择图片</button>
        </div>
        <div class="hint">图片会自动压缩到 64×64，大小 ≤64KB</div>
      </div>
      <div class="fld">
        <label>分类</label>
        <input id="f_category" placeholder="如：社交 / 工具" autocomplete="off" oninput="showSuggest()" onkeydown="navSuggest(event)">
        <div class="suggest" id="f_category_suggest"></div>
      </div>
    </div>

    <div class="fld">
      <label>简介</label>
      <textarea id="f_desc" placeholder="一句话描述"></textarea>
    </div>

    <!-- 版本 + 大小（数字+单位） -->
    <div class="grid2">
      <div class="fld"><label>版本</label><input id="f_version" placeholder="v1.0.0"></div>
      <div class="fld">
        <label>大小</label>
        <div class="grid3">
          <input id="f_sizeNum" type="number" min="0" step="0.1" placeholder="120">
          <select id="f_sizeUnit">
            <option value="KB">KB</option>
            <option value="MB" selected>MB</option>
            <option value="GB">GB</option>
          </select>
        </div>
      </div>
    </div>

    <div class="fld">
      <label>更新日期</label>
      <input type="date" id="f_updated">
    </div>

    <!-- 截图（支持上传或URL，每张可设主图） -->
    <div class="fld">
      <label>截图（点 ★ 设为主图，第一张也可手动改顺序）</label>
      <div class="shots" id="f_shots"></div>
      <button type="button" class="add-shot" onclick="addShotRow()">+ 添加截图（URL 或上传）</button>
      <div class="hint">每行可输入图片 URL，或点击"上传"按钮选择本地图片（自动压缩到 ≤200KB）</div>
    </div>

    <div class="plat">
      <div class="ttl">各平台下载地址（只填你有的）</div>
      <div class="grid2">
        <div class="fld"><label>🪟 Windows</label><input id="f_pc" placeholder="https://..."></div>
        <div class="fld"><label>🤖 Android</label><input id="f_android" placeholder="https://..."></div>
        <div class="fld"><label>🍎 iOS</label><input id="f_ios" placeholder="https://..."></div>
        <div class="fld"><label>🍏 macOS</label><input id="f_mac" placeholder="https://..."></div>
        <div class="fld"><label>🐧 Linux</label><input id="f_linux" placeholder="https://..."></div>
      </div>
    </div>

    <div class="bar" style="margin-top:18px">
      <button class="btn-sm" onclick="closeForm()">取消</button>
      <button class="btn-sm primary" onclick="saveForm()">保存</button>
    </div>
  </div>
</div>

<!-- 改密码弹层 -->
<div class="modal" id="passModal">
  <div class="panel">
    <h2>修改管理密码</h2>
    <div class="fld"><label>新密码</label><input id="p_new" type="password" placeholder="至少 4 位"></div>
    <div class="err" id="passErr" style="color:#f87171;font-size:13px;min-height:18px"></div>
    <div class="bar" style="margin-top:10px">
      <button class="btn-sm" onclick="closePass()">取消</button>
      <button class="btn-sm primary" onclick="savePass()">确认修改</button>
    </div>
  </div>
</div>

<script>
const API = "/api/softwares";
function getPass() { return sessionStorage.getItem("admin_pass") || ""; }
function setPass(p) { sessionStorage.setItem("admin_pass", p); }

// ===== 登录 =====
async function doLogin() {
  const p = document.getElementById("passInput").value;
  const err = document.getElementById("loginErr");
  err.textContent = "";
  try {
    const r = await fetch(API, {
      method: "PUT",
      headers: { "content-type": "application/json", "x-admin-pass": p },
      body: JSON.stringify({ id: "__probe__", software: {} })
    });
    if (r.status === 401) { err.textContent = "密码错误"; return; }
    const data = await r.json().catch(() => ({}));
    if (r.status === 200 && (data.ok === true || data.ok === undefined)) {
      setPass(p);
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("adminBox").style.display = "block";
      loadList();
    } else {
      err.textContent = "登录失败：" + (data.error || "未知错误");
    }
  } catch (e) {
    err.textContent = "网络错误：" + e.message;
  }
}
function logout() { sessionStorage.removeItem("admin_pass"); location.reload(); }
document.getElementById("passInput").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

// ===== 顶部统计卡 =====
function renderStats(list) {
  const box = document.getElementById("statsBox");
  const cats = [...new Set(list.map(s => s.category).filter(Boolean))];
  const updated = list.map(s => s.updated).filter(Boolean).sort().reverse()[0] || "—";
  box.innerHTML = `
    <div class="stat"><div class="lbl">软件总数</div><div class="val">${list.length}</div></div>
    <div class="stat"><div class="lbl">分类数</div><div class="val">${cats.length}</div><div class="cats">${cats.map(c => `<span>${c}</span>`).join("") || "<span style='color:#64748b'>暂无</span>"}</div></div>
    <div class="stat"><div class="lbl">最近更新</div><div class="val" style="font-size:1.1rem">${updated}</div></div>
    <div class="stat"><div class="lbl">项目地址</div><div class="val" style="font-size:0.95rem"><a href="https://soft-share.pages.dev" target="_blank" style="color:#3b82f6;text-decoration:none">soft-share.pages.dev</a></div><div class="ext">点击访问前台</div></div>
  `;
}

// ===== 列表 =====
async function loadList() {
  const box = document.getElementById("listBox");
  box.innerHTML = "<div class='sub'>加载中...</div>";
  try {
    const r = await fetch(API);
    const list = await r.json();
    renderStats(list);
    if (!list.length) { box.innerHTML = "<div class='sub'>还没有软件，点右上角「新增软件」。</div>"; return; }
    box.innerHTML = list.map(s => `
      <div class="row">
        <div class="ic">${renderIco(s.icon)}</div>
        <div class="nm">${esc(s.name)}<small>${esc(s.category || "")} ${esc(s.version || "")} · ${esc(s.size || "")} · ${(s.downloads && Object.keys(s.downloads).length) || 0} 个平台</small></div>
        <div class="ops">
          <button class="btn-sm" onclick="openForm('${s.id}')">编辑</button>
          <button class="btn-sm danger" onclick="delItem('${s.id}')">删除</button>
        </div>
      </div>`).join("");
  } catch (e) {
    box.innerHTML = "<div class='err'>加载失败：" + e.message + "</div>";
  }
}

function esc(s) { return String(s == null ? "" : s).replace(/[<>&"']/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c])); }
function renderIco(icon) {
  if (!icon) return "📦";
  if (icon.startsWith("data:image/")) return `<img src="${icon}">`;
  return esc(icon);
}

// ===== 图标上传处理 =====
function toggleIcoType() {
  const type = document.querySelector('input[name="icoType"]:checked').value;
  document.getElementById("f_icoEmoji").style.display = type === "emoji" ? "" : "none";
  document.getElementById("f_icoBtn").style.display = type === "image" ? "" : "none";
  updateIcoPreview();
}
function updateIcoPreview() {
  const box = document.getElementById("f_icoBox");
  const type = document.querySelector('input[name="icoType"]:checked').value;
  if (type === "emoji") {
    box.innerHTML = esc(document.getElementById("f_icoEmoji").value || "📦");
  } else if (box._b64) {
    box.innerHTML = `<img src="${box._b64}">`;
  } else {
    box.innerHTML = "📦";
  }
}
function uploadIco(input) {
  const f = input.files[0];
  if (!f) return;
  compressImage(f, 64, 64, 64 * 1024).then(b64 => {
    const box = document.getElementById("f_icoBox");
    box._b64 = b64;
    box.innerHTML = `<img src="${b64}">`;
  }).catch(e => alert("图标处理失败：" + e.message));
}

// ===== 截图管理 =====
let shotsState = []; // {url, isMain}

function addShotRow(url = "", isMain = false) {
  shotsState.push({ url, isMain });
  renderShots();
}
function renderShots() {
  const box = document.getElementById("f_shots");
  box.innerHTML = "";
  if (!shotsState.length) {
    box.innerHTML = '<div class="hint" style="padding:8px">还没有截图，点下方按钮添加</div>';
    return;
  }
  shotsState.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "shot-item";
    row.innerHTML = `
      <div class="thumb">${s.url && (s.url.startsWith("data:") || /^https?:/i.test(s.url)) ? `<img src="${s.url}">` : "?"}</div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <input type="text" placeholder="https:// 图片直链" value="${esc(s.url.startsWith("data:") ? "[已上传]" : s.url)}" onchange="updateShot(${i}, 'url', this.value)">
        <input type="file" accept="image/*" onchange="uploadShot(${i}, this)">
      </div>
      <button class="star ${s.isMain ? 'on' : ''}" onclick="setMain(${i})" title="设为主图">★</button>
      <button class="del" onclick="delShot(${i})">×</button>
    `;
    box.appendChild(row);
  });
}
function updateShot(i, key, val) { shotsState[i][key] = val.trim(); renderShots(); }
function setMain(i) {
  shotsState.forEach((s, j) => s.isMain = (j === i));
  renderShots();
}
function delShot(i) { shotsState.splice(i, 1); renderShots(); }

function uploadShot(i, input) {
  const f = input.files[0];
  if (!f) return;
  compressImage(f, 800, 800, 200 * 1024).then(b64 => {
    shotsState[i].url = b64;
    renderShots();
  }).catch(e => alert("截图处理失败：" + e.message));
}

// 图片压缩（保持宽高比 + 控制大小）
function compressImage(file, maxW, maxH, maxBytes) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxW) { height = height * maxW / width; width = maxW; }
        if (height > maxH) { width = width * maxH / height; height = maxH; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        // 尝试不同质量直到符合大小
        let q = 0.85, b64;
        const tryCompress = () => {
          b64 = canvas.toDataURL("image/jpeg", q);
          const size = b64.length * 3 / 4;
          if (size > maxBytes && q > 0.3) { q -= 0.1; tryCompress(); }
          else resolve(b64);
        };
        tryCompress();
      };
      img.onerror = () => reject(new Error("图片格式不支持"));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("读取失败"));
    reader.readAsDataURL(file);
  });
}

// ===== 分类联想 =====
const CAT_KEY = "site_cats_v1";
function loadCats() { try { return JSON.parse(localStorage.getItem(CAT_KEY) || "[]"); } catch(e) { return []; } }
function saveCat(c) {
  if (!c) return;
  const cats = loadCats();
  if (!cats.includes(c)) { cats.unshift(c); localStorage.setItem(CAT_KEY, JSON.stringify(cats.slice(0, 30))); }
}
function showSuggest() {
  const inp = document.getElementById("f_category");
  const kw = inp.value.trim().toLowerCase();
  const cats = loadCats().filter(c => !kw || c.toLowerCase().includes(kw));
  const box = document.getElementById("f_category_suggest");
  if (!cats.length) { box.classList.remove("show"); return; }
  box.innerHTML = cats.map(c => `<div data-c="${esc(c)}">${esc(c)}</div>`).join("");
  box.classList.add("show");
  [...box.children].forEach((d, i) => {
    d.addEventListener("mousedown", () => { inp.value = d.dataset.c; box.classList.remove("show"); });
    d.addEventListener("mouseenter", () => { [...box.children].forEach(x => x.classList.remove("focus")); d.classList.add("focus"); });
  });
}
function navSuggest(e) {
  const box = document.getElementById("f_category_suggest");
  if (!box.classList.contains("show")) return;
  const items = [...box.children];
  const cur = items.findIndex(d => d.classList.contains("focus"));
  if (e.key === "ArrowDown") { e.preventDefault(); items.forEach(d => d.classList.remove("focus")); items[(cur+1) % items.length]?.classList.add("focus"); }
  else if (e.key === "ArrowUp") { e.preventDefault(); items.forEach(d => d.classList.remove("focus")); items[(cur-1+items.length) % items.length]?.classList.add("focus"); }
  else if (e.key === "Enter") {
    const sel = items.find(d => d.classList.contains("focus"));
    if (sel) { e.preventDefault(); document.getElementById("f_category").value = sel.dataset.c; box.classList.remove("show"); }
  } else if (e.key === "Escape") { box.classList.remove("show"); }
}
document.addEventListener("click", e => {
  if (!e.target.closest("#f_category")) document.getElementById("f_category_suggest").classList.remove("show");
});

// ===== 表单打开/保存 =====
function openForm(id) {
  document.getElementById("formTitle").textContent = id ? "编辑软件" : "新增软件";
  document.getElementById("f_id").value = id || "";
  document.getElementById("f_icoBox")._b64 = "";
  document.querySelector('input[name="icoType"][value="emoji"]').checked = true;
  document.getElementById("f_icoFile").value = "";
  document.getElementById("formModal").classList.add("show");
  if (id) {
    fetch(API).then(r => r.json()).then(list => {
      const s = list.find(x => x.id === id);
      if (!s) return;
      // 图标
      const box = document.getElementById("f_icoBox");
      if (s.icon && s.icon.startsWith("data:image/")) {
        document.querySelector('input[name="icoType"][value="image"]').checked = true;
        box._b64 = s.icon;
        document.getElementById("f_icoEmoji").value = "";
      } else {
        document.getElementById("f_icoEmoji").value = s.icon || "";
      }
      toggleIcoType();
      // 字段
      document.getElementById("f_name").value = s.name || "";
      document.getElementById("f_category").value = s.category || "";
      document.getElementById("f_desc").value = s.desc || "";
      document.getElementById("f_version").value = s.version || "";
      // 大小解析
      const m = String(s.size || "").match(/^([\d.]+)\s*([KMG]B)?$/i);
      if (m) {
        document.getElementById("f_sizeNum").value = m[1];
        document.getElementById("f_sizeUnit").value = (m[2] || "MB").toUpperCase();
      } else {
        document.getElementById("f_sizeNum").value = "";
      }
      document.getElementById("f_updated").value = s.updated || today();
      document.getElementById("f_pc").value = (s.downloads && s.downloads.pc) || "";
      document.getElementById("f_android").value = (s.downloads && s.downloads.android) || "";
      document.getElementById("f_ios").value = (s.downloads && s.downloads.ios) || "";
      document.getElementById("f_mac").value = (s.downloads && s.downloads.mac) || "";
      document.getElementById("f_linux").value = (s.downloads && s.downloads.linux) || "";
      // 截图
      shotsState = (s.screenshots || []).map(url => ({ url, isMain: false }));
      if (s.mainShot) { const idx = shotsState.findIndex(x => x.url === s.mainShot); if (idx >= 0) shotsState[idx].isMain = true; }
      renderShots();
    });
  } else {
    ["f_name","f_category","f_desc","f_version","f_sizeNum","f_pc","f_android","f_ios","f_mac","f_linux"].forEach(k => document.getElementById(k).value = "");
    document.getElementById("f_icoEmoji").value = "";
    document.getElementById("f_icoBtn").value = "";
    document.getElementById("f_updated").value = today();
    shotsState = [];
    addShotRow();
    renderShots();
    toggleIcoType();
  }
}
function today() { return new Date().toISOString().slice(0, 10); }
function closeForm() { document.getElementById("formModal").classList.remove("show"); }

async function saveForm() {
  const id = document.getElementById("f_id").value;
  const icoType = document.querySelector('input[name="icoType"]:checked').value;
  let icon = "";
  if (icoType === "emoji") icon = document.getElementById("f_icoEmoji").value.trim() || "📦";
  else icon = document.getElementById("f_icoBox")._b64 || "📦";
  const sizeNum = document.getElementById("f_sizeNum").value;
  const sizeUnit = document.getElementById("f_sizeUnit").value;
  const size = sizeNum ? `${sizeNum} ${sizeUnit}` : "";
  const downloads = {};
  const map = { pc: "f_pc", android: "f_android", ios: "f_ios", mac: "f_mac", linux: "f_linux" };
  Object.entries(map).forEach(([k, id]) => { const v = document.getElementById(id).value.trim(); if (v) downloads[k] = v; });
  const category = document.getElementById("f_category").value.trim();
  if (category) saveCat(category);
  const validShots = shotsState.filter(s => s.url && !s.url.startsWith("[已上传]") && s.url.trim() !== "");
  const mainShot = validShots.find(s => s.isMain)?.url || null;

  const software = {
    id: id || ("s" + Date.now()),
    name: document.getElementById("f_name").value.trim() || "未命名",
    icon,
    desc: document.getElementById("f_desc").value.trim(),
    category,
    version: document.getElementById("f_version").value.trim(),
    size,
    updated: document.getElementById("f_updated").value || today(),
    screenshots: validShots.map(s => s.url),
    mainShot,
    downloads
  };

  const method = id ? "PUT" : "POST";
  const body = id ? { id, software } : { software };
  try {
    const r = await fetch(API, {
      method,
      headers: { "content-type": "application/json", "x-admin-pass": getPass() },
      body: JSON.stringify(body)
    });
    const res = await r.json();
    if (res.ok) { closeForm(); loadList(); }
    else alert("保存失败：" + (res.error || "未知错误"));
  } catch (e) {
    alert("网络错误：" + e.message);
  }
}

async function delItem(id) {
  if (!confirm("确定删除该软件？")) return;
  try {
    const r = await fetch(API, {
      method: "DELETE",
      headers: { "content-type": "application/json", "x-admin-pass": getPass() },
      body: JSON.stringify({ id })
    });
    const res = await r.json();
    if (res.ok) loadList(); else alert("删除失败：" + (res.error || ""));
  } catch (e) {
    alert("网络错误：" + e.message);
  }
}

// ===== 改密码 =====
function openPass() { document.getElementById("passErr").textContent = ""; document.getElementById("p_new").value = ""; document.getElementById("passModal").classList.add("show"); }
function closePass() { document.getElementById("passModal").classList.remove("show"); }
async function savePass() {
  const np = document.getElementById("p_new").value;
  if (np.length < 4) { document.getElementById("passErr").textContent = "密码至少 4 位"; return; }
  try {
    const r = await fetch(API, {
      method: "PUT",
      headers: { "content-type": "application/json", "x-admin-pass": getPass() },
      body: JSON.stringify({ action: "changepass", newpass: np })
    });
    const res = await r.json();
    if (res.ok) { setPass(np); closePass(); alert("密码已修改，请牢记新密码"); }
    else document.getElementById("passErr").textContent = "修改失败：" + (res.error || "");
  } catch (e) {
    document.getElementById("passErr").textContent = "网络错误：" + e.message;
  }
}

if (getPass()) { document.getElementById("loginBox").style.display = "none"; document.getElementById("adminBox").style.display = "block"; loadList(); }

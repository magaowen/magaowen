<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoftHub · 后台管理</title>
<link rel="stylesheet" href="css/main.css">
<style>
/* ================= 后台专属样式 ================= */
.admin-layout { display: flex; min-height: 100vh; }
.sidebar {
  width: 232px; flex: none; background: var(--bg2);
  border-right: 1px solid var(--border); padding: 20px 14px;
  display: flex; flex-direction: column; gap: 4px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.sb-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; padding: 4px 10px 18px; }
.sb-logo .ic {
  width: 34px; height: 34px; border-radius: 10px; background: var(--grad);
  display: flex; align-items: center; justify-content: center; box-shadow: var(--glow);
}
.sb-item {
  display: flex; align-items: center; gap: 11px; padding: 11px 14px;
  border-radius: 11px; font-size: 14px; color: var(--text2);
  background: none; border: none; width: 100%; text-align: left; transition: all .18s;
  position: relative;
}
.sb-item:hover { background: var(--grad-soft); color: var(--primary); }
.sb-item.on { background: var(--grad); color: #fff; box-shadow: var(--glow); font-weight: 600; }
.sb-item .cnt {
  margin-left: auto; font-size: 11px; background: var(--err); color: #fff;
  border-radius: 999px; padding: 1px 7px; font-weight: 700;
}
.sb-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); }
.sb-upload {
  background: var(--grad); color: #fff !important; font-weight: 700; box-shadow: var(--glow);
  border-radius: 12px; margin-bottom: 8px;
}
.sb-upload:hover { opacity: .92; color: #fff !important; box-shadow: var(--glow); }

.main { flex: 1; min-width: 0; padding: 26px 30px 60px; }
.page-head { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head h2 { font-size: 22px; }
.page-head .right { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.page-head input, .page-head select { width: auto; }

/* 统计卡片 */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 20px; }
.stat-card { padding: 20px; position: relative; overflow: hidden; }
.stat-card .ic {
  width: 44px; height: 44px; border-radius: 13px; font-size: 22px;
  display: flex; align-items: center; justify-content: center; background: var(--grad-soft);
  margin-bottom: 12px;
}
.stat-card b { font-size: 26px; display: block; }
.stat-card span { font-size: 12.5px; color: var(--text3); }
.stat-card .trend { position: absolute; top: 18px; right: 18px; font-size: 12px; }

.chart-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; margin-bottom: 20px; }
.chart-card { padding: 20px; }
.chart-card h4 { font-size: 14.5px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
canvas { width: 100%; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.list-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.list-row:last-child { border-bottom: none; }

.gate {
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
}
.gate .modal { animation: none; }

@media (max-width: 900px) {
  .chart-grid, .two-col { grid-template-columns: 1fr; }
  .sidebar { width: 64px; padding: 20px 8px; }
  .sb-item span.txt, .sb-logo span.txt { display: none; }
  .main { padding: 20px 14px 60px; }
}

/* 手机端：侧边栏变底部标签栏 */
@media (max-width: 720px) {
  .admin-layout { flex-direction: column; }
  .sidebar {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto; width: 100%;
    flex-direction: row; align-items: stretch; gap: 4px; padding: 6px 8px;
    border-right: none; border-top: 1px solid var(--border); background: var(--bg2);
    z-index: 200; overflow-x: auto; overflow-y: hidden;
  }
  .sidebar .sb-logo { display: none; }
  .sb-foot { display: contents; }
  .sb-item {
    flex: 1 0 auto; flex-direction: column; gap: 2px; justify-content: center;
    text-align: center; padding: 8px 6px; font-size: 11px; border-radius: 10px;
  }
  .sb-item span.txt { display: inline; font-size: 10.5px; }
  .sb-item .cnt { margin: 0; }
  .sb-upload { margin-bottom: 0; flex-direction: column; }
  .main { padding: 16px 12px 96px; }
  .page-head { margin-bottom: 16px; }
  .page-head h2 { font-size: 18px; }
  .detail-stats { grid-template-columns: repeat(3, 1fr); }
  .table-wrap { -webkit-overflow-scrolling: touch; }
}
@media (max-width: 480px) {
  .detail-stats { grid-template-columns: repeat(2, 1fr); }
}

/* ---------- 安装包上传器 ---------- */
.pkg-uploader { margin-top: 4px; }
.pkg-add {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; padding: 22px 16px; border: 2px dashed var(--border); border-radius: 14px;
  color: var(--text3); cursor: pointer; transition: all .2s; font-size: 13.5px;
  background: var(--bg3);
}
.pkg-add:hover, .pkg-add.drag { border-color: var(--primary); color: var(--primary); background: var(--grad-soft); }
.pkg-icon { font-size: 32px; }
.pkg-selected {
  display: flex; align-items: center; gap: 14px; padding: 16px 18px;
  border: 1px solid var(--border); border-radius: 14px; background: var(--bg3);
}
.pkg-info { flex: 1; min-width: 0; }
.pkg-filename { display: block; font-weight: 600; font-size: 14px; word-break: break-all; color: var(--text); }
.pkg-size { display: block; font-size: 12px; color: var(--text3); margin-top: 3px; }
.pkg-progress-wrap {
  height: 8px; background: var(--border); border-radius: 999px; overflow: hidden;
  margin-top: 10px;
}
.pkg-progress-bar {
  height: 100%; width: 0%; border-radius: 999px; background: var(--grad);
  transition: width .15s linear;
}
.pkg-status { display: block; font-size: 12px; color: var(--ok); margin-top: 6px; font-weight: 600; }
.pkg-del-btn { flex: none; align-self: flex-start; }

/* ---------- 后台移动端增强适配 ---------- */
@media (max-width: 720px) {
  /* 表格优化：小字号+横向滚动 */
  table { font-size: 12px; min-width: 600px; }
  th, td { padding: 9px 10px; white-space: nowrap; }
  /* 统计卡片：单列紧凑 */
  .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat-card { padding: 14px; }
  .stat-card b { font-size: 20px; }
  .stat-card .ic { width: 36px; height: 36px; font-size: 18px; }
  /* 弹窗：全屏宽 */
  .modal { max-width: 100vw; border-radius: 18px 18px 0 0; padding: 20px 16px 28px; margin: auto 0 0; }
  .modal-mask { padding: 0; align-items: flex-end; }
  /* 页头 */
  .page-head h2 { font-size: 17px; }
  .page-head .right { gap: 6px; max-width: 100%; overflow-x: auto; }
  .page-head input, .page-head select { font-size: 12.5px; width: 120px !important; }
  /* 表单 */
  .form-row { grid-template-columns: 1fr; gap: 0; }
  label { font-size: 12.5px; margin-top: 10px; margin-bottom: 5px; }
  textarea { min-height: 72px; }
  /* 列表行 */
  .list-row { padding: 8px 0; font-size: 12.5px; gap: 8px; flex-wrap: wrap; }
  /* 底部标签栏：可滚动 + 图标优先 */
  .sidebar { padding: 5px 4px; gap: 2px; }
  .sb-item { padding: 7px 4px; font-size: 10.5px; border-radius: 8px; min-width: 0; }
  .sb-item span:first-child { font-size: 15px; }
  .sb-item span.txt { font-size: 9px; line-height: 1.2; }
  .main { padding: 14px 10px 92px; }
  /* 两列布局变单列 */
  .two-col, .chart-grid { grid-template-columns: 1fr !important; }
  /* 商务合作页移动端 */
  .biz-contact-edit { flex-wrap: wrap; }
  .biz-contact-edit input.bc-icon-in { width: 42px; }
  /* 安装包上传器移动端 */
  .pkg-selected { flex-direction: column; align-items: stretch; gap: 10px; }
  .pkg-del-btn { align-self: flex-end; }
  /* 图片网格更密 */
  .img-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; }
  /* 按钮组 */
  .btn-sm { padding: 4px 9px; font-size: 11.5px; }
}
@media (max-width: 400px) {
  .stat-grid { grid-template-columns: 1fr; }
  .sidebar { padding: 4px 2px; }
  .sb-item { padding: 6px 2px; font-size: 9.5px; }
  .sb-item span:first-child { font-size: 14px; }
}
</style>
</head>
<body>
<div id="root"></div>
<script src="js/db.js"></script>
<script src="js/admin.js"></script>
</body>
</html>

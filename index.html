<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国宠物交易 - 同城猫咪狗狗免费发布</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#fdf8f4;--card:#fff;--card2:rgba(255,255,255,.9);--text:#2d2d2d;--text2:#888;--border:#f0e8e0;--accent:#e8784a;--accent2:#f5a623;--green:#4caf50;--red:#f44336;--rad:16px}
    [data-theme="dark"]{--bg:#1a1410;--card:rgba(255,255,255,.04);--card2:rgba(255,255,255,.05);--text:#e8d5c8;--text2:#9a8a7a;--border:rgba(255,255,255,.07);--accent:#f09060;--accent2:#f5b840}
    body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .4s,color .4s}
    .theme-toggle{position:fixed;top:16px;right:20px;z-index:100;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .3s}
    .theme-toggle:hover{transform:scale(1.1)}

    .hero{background:linear-gradient(135deg,#f5a623,#e8784a 50%,#e84a5f);color:#fff;padding:48px 20px 36px;text-align:center;position:relative}
    .hero h1{font-size:2rem;font-weight:700;letter-spacing:1px}
    .hero p{font-size:1rem;opacity:.9;margin-top:6px}
    .hero .note{font-size:12px;opacity:.7;margin-top:10px}

    /* 城市选择器 */
    .city-bar{max-width:1200px;margin:-18px auto 0;padding:0 20px;position:relative;z-index:2}
    .city-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:14px;padding:12px 16px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.04)}
    .city-row .lbl{font-size:13px;color:var(--text2);white-space:nowrap;font-weight:600}
    .city-row select{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none;min-width:100px;cursor:pointer}
    .city-row select:focus{border-color:var(--accent)}
    .city-row .locating{font-size:12px;color:var(--accent);cursor:pointer;white-space:nowrap}

    /* 工具栏 */
    .toolbar{max-width:1200px;margin:14px auto 0;padding:0 20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    .search-box{flex:1;min-width:180px;padding:11px 16px;border-radius:24px;font-size:14px;outline:none;background:var(--card);border:1px solid var(--border);color:var(--text)}
    .search-box:focus{border-color:var(--accent)}
    .tag-box{display:flex;gap:8px;flex-wrap:wrap}
    .tag-btn{padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;transition:all .25s;background:var(--card);border:1px solid var(--border);color:var(--text2)}
    .tag-btn:hover{border-color:var(--accent);color:var(--accent)}
    .tag-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

    /* 列表 */
    .list{max-width:1200px;margin:20px auto 60px;padding:0 20px;display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
    .item{background:var(--card);border-radius:var(--rad);overflow:hidden;border:1px solid var(--border);cursor:pointer;transition:all .3s;animation:fadeIn .5s both}
    .item:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.1)}
    .item .pic{width:100%;aspect-ratio:4/3;background:var(--bg);overflow:hidden;position:relative}
    .item .pic img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
    .item:hover .pic img{transform:scale(1.05)}
    .item .pic .price{position:absolute;bottom:10px;right:10px;background:var(--accent);color:#fff;padding:5px 12px;border-radius:10px;font-weight:700;font-size:15px}
    .item .pic .loc{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.5);color:#fff;padding:3px 8px;border-radius:6px;font-size:11px}
    .item .info{padding:14px 16px}
    .item .info h3{font-size:15px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .item .info .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
    .item .info .tags span{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--bg);color:var(--text2)}
    .item .info .tags span.gender{color:#e8784a;font-weight:600}
    @keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
    .item:nth-child(1){animation-delay:.03s}.item:nth-child(2){animation-delay:.06s}.item:nth-child(3){animation-delay:.09s}.item:nth-child(4){animation-delay:.12s}.item:nth-child(5){animation-delay:.15s}.item:nth-child(6){animation-delay:.18s}

    .empty{text-align:center;padding:80px 20px;color:var(--text2)}
    .empty .big{font-size:60px;opacity:.3;margin-bottom:12px}
    .foot{text-align:center;padding:24px;color:var(--text2);font-size:12px;border-top:1px solid var(--border);max-width:1200px;margin:0 auto}
    .foot a{color:var(--accent)}

    @media(max-width:640px){
      .list{grid-template-columns:1fr;gap:14px;padding:0 14px 40px}
      .hero{padding:36px 14px 28px}.hero h1{font-size:1.5rem}
      .city-row{gap:4px;padding:10px 12px}
      .city-row select{font-size:12px;padding:6px 8px;min-width:80px}
      .toolbar{padding:0 14px;flex-direction:column;align-items:stretch}
    }
  </style>
</head>
<body>

<button class="theme-toggle" id="themeBtn" title="切换主题">🌓</button>

<header class="hero">
  <h1>🐾 全国宠物交易</h1>
  <p>同城猫咪狗狗 · 免费发布 · 当面交易</p>
  <div class="note">本站仅提供信息撮合，不参与交易。请当面验宠，谨防诈骗</div>
</header>

<div class="city-bar">
  <div class="city-row">
    <span class="lbl">📍</span>
    <select id="selProv" onchange="onProv()"><option value="">全国</option></select>
    <select id="selCity" onchange="onCity()"><option value="">全市</option></select>
    <select id="selDist" onchange="onDist()"><option value="">全区</option></select>
    <span class="locating" onclick="locateMe()" title="自动定位">📍 定位</span>
  </div>
</div>

<div class="toolbar">
  <input class="search-box" type="text" placeholder="搜品种、城市、价格..." id="si">
  <div class="tag-box" id="tagFilter"><button class="tag-btn active" data-cat="all">全部</button></div>
</div>

<div class="list" id="list"></div>
<div class="empty" id="empty" style="display:none"><div class="big">🐾</div><h3>该地区暂无宠物信息</h3><div style="margin-top:8px;color:var(--text2)">切换城市试试，或成为第一个发布的人</div></div>

<div class="foot">
  ⚠ 本站为免费信息发布平台，不参与任何交易。请当面交易、现场验宠，谨防病宠/货不对板。<br>
  禁止发布保护动物，违规者永久封禁。联系管理员：后台留言 ｜ <a href="/admin.html">商家发布</a>
</div>

<script src="./data.js"></script>
<script>
// === 主题 ===
(function(){const s=localStorage.getItem("theme")||"light";document.documentElement.setAttribute("data-theme",s);document.getElementById("themeBtn").textContent=s==="dark"?"☀️":"🌙"})();
document.getElementById("themeBtn").onclick=()=>{const n=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",n);localStorage.setItem("theme",n);document.getElementById("themeBtn").textContent=n==="dark"?"☀️":"🌙"};

function esc(s){return String(s==null?"":s).replace(/[<>&"']/g,c=({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c]))}

// === 城市数据 ===
const CITY={北京:["北京市"],上海:["上海市"],天津:["天津市"],重庆:["重庆市"],
  广东:["广州","深圳","东莞","佛山","珠海","中山","惠州","汕头","江门","湛江","茂名","肇庆","揭阳","清远","韶关","河源","阳江","云浮","梅州","汕尾","潮州"],
  江苏:["南京","苏州","无锡","常州","南通","徐州","扬州","镇江","盐城","泰州","淮安","连云港","宿迁"],
  浙江:["杭州","宁波","温州","嘉兴","湖州","绍兴","金华","台州","衢州","丽水","舟山"],
  山东:["济南","青岛","烟台","潍坊","临沂","淄博","济宁","泰安","威海","日照","德州","聊城","滨州","菏泽","枣庄"],
  四川:["成都","绵阳","德阳","宜宾","南充","泸州","乐山","达州","广元","内江","自贡","攀枝花","遂宁","眉山","资阳","雅安","凉山","广安","巴中"],
  湖北:["武汉","宜昌","襄阳","荆州","黄冈","十堰","孝感","恩施","鄂州","黄石","咸宁","荆门","随州"],
  湖南:["长沙","株洲","湘潭","衡阳","岳阳","常德","郴州","怀化","永州","邵阳","益阳","娄底","湘西","张家界"],
  河南:["郑州","洛阳","南阳","许昌","新乡","周口","商丘","信阳","开封","驻马店","平顶山","安阳","焦作","濮阳","漯河","三门峡"],
  福建:["福州","厦门","泉州","漳州","莆田","龙岩","三明","宁德","南平"],
  河北:["石家庄","唐山","邯郸","保定","沧州","邢台","廊坊","秦皇岛","张家口","衡水","承德"],
  安徽:["合肥","芜湖","马鞍山","蚌埠","安庆","滁州","阜阳","六安","亳州","淮南","淮北","铜陵","宣城","黄山","池州","宿州"],
  辽宁:["沈阳","大连","鞍山","抚顺","本溪","锦州","营口","阜新","辽阳","盘锦","铁岭","朝阳","丹东"],
  江西:["南昌","九江","赣州","上饶","宜春","吉安","抚州","景德镇","萍乡","新余","鹰潭"],
  陕西:["西安","咸阳","宝鸡","渭南","汉中","延安","榆林","安康","商洛"],
  广西:["南宁","柳州","桂林","玉林","北海","梧州","钦州","百色","河池","贵港"],
  云南:["昆明","大理","丽江","曲靖","玉溪","昭通","普洱","保山","临沧","红河","文山","西双版纳","楚雄","德宏"],
  贵州:["贵阳","遵义","毕节","六盘水","安顺","铜仁","黔东南","黔南","黔西南"],
  山西:["太原","大同","临汾","运城","长治","晋中","阳泉","晋城","忻州","朔州","吕梁"],
  吉林:["长春","吉林","四平","通化","延边","白城","松原","辽源"],
  黑龙江:["哈尔滨","大庆","齐齐哈尔","牡丹江","佳木斯","鸡西","鹤岗","双鸭山","绥化"],
  内蒙古:["呼和浩特","包头","鄂尔多斯","赤峰","通辽","呼伦贝尔","乌兰察布","巴彦淖尔","乌海"],
  甘肃:["兰州","天水","酒泉","庆阳","白银","武威","张掖","平凉"],
  新疆:["乌鲁木齐","克拉玛依","库尔勒","昌吉","石河子","伊犁","阿克苏","喀什"],
  海南:["海口","三亚","儋州","琼海"],
  宁夏:["银川","吴忠","石嘴山","中卫"],
  青海:["西宁","海东","格尔木"],
  西藏:["拉萨","日喀则","林芝"],
  香港:["香港"],澳门:["澳门"],台湾:["台北","高雄","台中","台南"]
};

// 初始化省份
(function(){const s=document.getElementById("selProv");Object.keys(CITY).forEach(p=>{s.add(new Option(p,p))})})();
function onProv(){const pv=document.getElementById("selProv").value,cc=document.getElementById("selCity");cc.innerHTML='<option value="">全市</option>';if(pv&&CITY[pv])CITY[pv].forEach(c=>cc.add(new Option(c,c)));document.getElementById("selDist").innerHTML='<option value="">全区</option>';applyFilter()}
function onCity(){document.getElementById("selDist").innerHTML='<option value="">全区</option>';applyFilter()}
function onDist(){applyFilter()}
function locateMe(){if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{alert("定位成功！可手动选择对应城市")},()=>alert("定位失败，请手动选择"))}else alert("浏览器不支持定位")}

// === 数据 ===
let pets=[],categories=[];
(async function load(){
  try{const[r1,r2]=await Promise.all([fetch("/api/softwares"),fetch("/api/categories")]);pets=await r1.json();categories=await r2.json();renderAll()}catch(e){pets=window.SOFTWARES||[];categories=window.CATEGORIES||[];renderAll()}
})();

function renderAll(){
  const fb=document.getElementById("tagFilter");fb.innerHTML='<button class="tag-btn active" data-cat="all">全部</button>';
  categories.forEach(c=>{const b=document.createElement("button");b.className="tag-btn";b.dataset.cat=c;b.textContent=c;fb.appendChild(b)});
  document.querySelectorAll(".tag-btn").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".tag-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");applyFilter()}));
  render(pets);
}

function render(list){
  const box=document.getElementById("list"),emp=document.getElementById("empty");box.innerHTML="";
  if(!list.length){box.style.display="none";emp.style.display="block";return}box.style.display="";emp.style.display="none";
  list.forEach((p,i)=>{const el=document.createElement("div");el.className="item";el.style.animationDelay=(i*.05)+"s";el.onclick=()=>location.href="./detail.html?id="+encodeURIComponent(p.id);
    const pic=(p.screenshots&&p.screenshots[0])||(p.icon&&p.icon.startsWith("data:image/")?p.icon:"");const loc=(p.province||"")+(p.city||"");const price=p.price?("¥"+p.price):"";
    el.innerHTML=`<div class="pic">${pic?`<img src="${pic}" loading="lazy">`:""}${price?`<div class="price">${esc(price)}</div>`:""}${loc?`<div class="loc">${esc(loc)}</div>`:""}</div>
    <div class="info"><h3>${esc(p.name||"未命名")}</h3>
    <div class="tags">
      ${p.breed?`<span>${esc(p.breed)}</span>`:""}${p.age?`<span>${esc(p.age)}</span>`:""}${p.gender?`<span class="gender">${esc(p.gender)}</span>`:""}${p.category?`<span>${esc(p.category)}</span>`:""}
    </div></div>`;box.appendChild(el)});
}

function applyFilter(){
  const kw=document.getElementById("si").value.toLowerCase(),cat=document.querySelector(".tag-btn.active")?.dataset.cat;
  const pv=document.getElementById("selProv").value,ct=document.getElementById("selCity").value,dt=document.getElementById("selDist").value;
  render(pets.filter(p=>{
    if(cat&&cat!=="all"&&p.category!==cat)return false;
    if(pv&&p.province!==pv)return false;
    if(ct&&p.city!==ct)return false;
    if(dt&&p.district!==dt)return false;
    if(kw){const s=(p.name+p.breed+p.city+p.desc||"").toLowerCase();if(!s.includes(kw))return false}
    return true;
  }));
}
document.getElementById("si").addEventListener("input",applyFilter);
</script>
</body>
</html>

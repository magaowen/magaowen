<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>软件分享站</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1a1a2e;
      --text-secondary: #71717a;
      --border: #e8eaed;
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --shadow: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-hover: 0 8px 24px rgba(0,0,0,0.09);
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
    .hero { background: linear-gradient(135deg, #1e3a8a, #2563eb 55%, #0ea5e9);
      color: #fff; padding: 44px 24px 36px; text-align: center; }
    .hero h1 { font-size: 1.9rem; font-weight: 600; }
    .hero p { font-size: 0.95rem; opacity: 0.9; margin-top: 6px; }

    /* 工具栏 */
    .toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
      max-width: 1600px; margin: 22px auto 0; padding: 0 24px; }
    .search-box { flex: 1; min-width: 200px; border: 1px solid var(--border); border-radius: 10px;
      padding: 11px 16px; font-size: 14px; outline: none; background: var(--card); transition: border-color .2s; }
    .search-box:focus { border-color: var(--accent); }
    .tag-filter { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag-btn { padding: 8px 16px; border-radius: 20px; font-size: 13px; border: 1px solid var(--border);
      background: var(--card); cursor: pointer; transition: all .2s; color: var(--text-secondary); }
    .tag-btn:hover { border-color: var(--accent); color: var(--accent); }
    .tag-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* 列表容器：电脑满铺多列，手机单列 */
    .list { max-width: 1600px; margin: 22px auto 0; padding: 0 24px 50px;
      display: grid; gap: 18px;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }

    .item { background: var(--card); border-radius: 14px; padding: 18px; border: 1px solid var(--border);
      box-shadow: var(--shadow); transition: all .25s; cursor: pointer; display: flex; gap: 14px; align-items: center; }
    .item:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
    .item .ico { width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0; font-size: 28px;
      display: flex; align-items: center; justify-content: center; background: var(--accent-light); }
    .item .info { min-width: 0; flex: 1; }
    .item .info h3 { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item .info .desc { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .item .info .meta { font-size: 11.5px; color: var(--text-secondary); margin-top: 6px; }
    .item .arrow { color: #cbd5e1; font-size: 20px; flex-shrink: 0; }

    .empty { text-align: center; padding: 80px 20px; color: var(--text-secondary); }
    .empty .icon { font-size: 52px; opacity: .4; margin-bottom: 12px; }

    .footer { text-align: center; padding: 30px; color: var(--text-secondary); font-size: 13px; border-top: 1px solid var(--border); }
    .footer a { color: var(--accent); text-decoration: none; }

    /* 手机：单列紧凑列表，更"列表"感 */
    @media (max-width: 640px) {
      .list { grid-template-columns: 1fr; gap: 12px; padding: 0 14px 40px; }
      .hero { padding: 32px 16px 26px; }
      .hero h1 { font-size: 1.5rem; }
      .toolbar { padding: 0 14px; flex-direction: column; align-items: stretch; }
      .item { padding: 14px; }
      .item .ico { width: 48px; height: 48px; font-size: 24px; }
    }
  </style>
</head>
<body>

<header class="hero">
  <h1>软件分享站</h1>
  <p>精选实用软件 · 多平台下载</p>
</header>

<div class="toolbar">
  <input class="search-box" type="text" placeholder="搜索软件..." id="searchInput">
  <div class="tag-filter" id="tagFilter">
    <button class="tag-btn active" data-cat="all">全部</button>
  </div>
</div>

<div class="list" id="list"></div>
<div class="empty" id="empty" style="display:none">
  <div class="icon">🔍</div>
  <h3>没有找到软件</h3>
</div>

<footer class="footer">零成本搭建 · 部署于 <a href="https://cloudstudio.net" target="_blank">CloudStudio</a></footer>

<script src="./data.js"></script>
<script>
  // 动态生成分类按钮
  const cats = ["all", ...new Set(softwares.map(s => s.category).filter(Boolean))];
  const filterBox = document.getElementById("tagFilter");
  cats.forEach((c, i) => {
    if (i === 0) return; // all 已存在
    const b = document.createElement("button");
    b.className = "tag-btn"; b.dataset.cat = c; b.textContent = c;
    filterBox.appendChild(b);
  });

  function render(list) {
    const box = document.getElementById("list");
    const empty = document.getElementById("empty");
    box.innerHTML = "";
    if (!list.length) { box.style.display = "none"; empty.style.display = "block"; return; }
    box.style.display = ""; empty.style.display = "none";
    list.forEach(s => {
      const el = document.createElement("div");
      el.className = "item";
      el.onclick = () => location.href = "./detail.html?id=" + s.id;
      el.innerHTML = `
        <div class="ico">${s.icon || "📦"}</div>
        <div class="info">
          <h3>${s.name}</h3>
          <div class="desc">${s.desc || ""}</div>
          <div class="meta">${s.version || ""} · ${s.size || ""} · ${s.category || ""}</div>
        </div>
        <div class="arrow">›</div>`;
      box.appendChild(el);
    });
  }

  function applyFilter() {
    const kw = document.getElementById("searchInput").value.toLowerCase();
    const cat = document.querySelector(".tag-btn.active").dataset.cat;
    const out = softwares.filter(s =>
      (cat === "all" || s.category === cat) &&
      (!kw || s.name.toLowerCase().includes(kw) || (s.desc || "").toLowerCase().includes(kw))
    );
    render(out);
  }

  document.getElementById("searchInput").addEventListener("input", applyFilter);
  document.querySelectorAll(".tag-btn").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".tag-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active"); applyFilter();
  }));
  render(softwares);
</script>
</body>
</html>

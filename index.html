<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国宠物交易 - 同城猫咪狗狗免费发布</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#fdf8f4;--card:#fff;--text:#2d2d2d;--text2:#888;--border:#f0e8e0;--accent:#e8784a;--accent2:#f5a623;--green:#4caf50;--red:#f44336;--rad:16px}
    [data-theme="dark"]{--bg:#1a1410;--card:rgba(255,255,255,.04);--text:#e8d5c8;--text2:#9a8a7a;--border:rgba(255,255,255,.07);--accent:#f09060;--accent2:#f5b840}
    body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .4s,color .4s}
    .theme-toggle{position:fixed;top:16px;right:20px;z-index:100;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .3s}
    .theme-toggle:hover{transform:scale(1.1)}
    .acc-bar{position:fixed;top:16px;right:70px;z-index:100;display:flex;gap:12px;align-items:center;font-size:13px}
    .acc-link{color:var(--text);text-decoration:none;font-weight:600;padding:6px 10px;border-radius:20px;border:1px solid var(--border);background:var(--card);white-space:nowrap}
    .acc-link:hover{color:var(--accent);border-color:var(--accent)}

    .hero{background:linear-gradient(135deg,#f5a623,#e8784a 50%,#e84a5f);color:#fff;padding:48px 20px 36px;text-align:center;position:relative}
    .hero h1{font-size:2rem;font-weight:700;letter-spacing:1px}
    .hero p{font-size:1rem;opacity:.9;margin-top:6px}
    .hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
    .hero-btn{padding:13px 28px;border-radius:28px;font-size:15px;font-weight:700;text-decoration:none;transition:all .3s;cursor:pointer;border:2px solid rgba(255,255,255,.5)}
    .hero-btn.buy{background:#fff;color:#e8784a}.hero-btn.buy:hover{transform:scale(1.05);box-shadow:0 6px 20px rgba(255,255,255,.3)}
    .hero-btn.sell{background:transparent;color:#fff}.hero-btn.sell:hover{background:rgba(255,255,255,.15);transform:scale(1.05)}
    .hero .note{font-size:12px;opacity:.7;margin-top:14px}

    .city-bar{max-width:1200px;margin:-18px auto 0;padding:0 20px;position:relative;z-index:2}
    .city-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:14px;padding:12px 16px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.04)}
    .city-row .lbl{font-size:13px;color:var(--text2);white-space:nowrap;font-weight:600}
    .city-row select{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none;min-width:100px;cursor:pointer}
    .city-row select:focus{border-color:var(--accent)}

    .toolbar{max-width:1200px;margin:14px auto 0;padding:0 20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    .tabs2{display:flex;gap:8px}
    .tabs2 .t{padding:8px 18px;border-radius:20px;font-size:14px;cursor:pointer;background:var(--card);border:1px solid var(--border);color:var(--text2);font-weight:600}
    .tabs2 .t.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .search-box{flex:1;min-width:180px;padding:11px 16px;border-radius:24px;font-size:14px;outline:none;background:var(--card);border:1px solid var(--border);color:var(--text)}
    .search-box:focus{border-color:var(--accent)}
    .tag-box{display:flex;gap:8px;flex-wrap:wrap;max-width:1200px;margin:12px auto 0;padding:0 20px}
    .tag-btn{padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;transition:all .25s;background:var(--card);border:1px solid var(--border);color:var(--text2)}
    .tag-btn:hover{border-color:var(--accent);color:var(--accent)}
    .tag-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

    .list{max-width:1200px;margin:20px auto 60px;padding:0 20px;display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
    .item{background:var(--card);border-radius:var(--rad);overflow:hidden;border:1px solid var(--border);cursor:pointer;transition:all .3s;animation:fadeIn .5s both}
    .item:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.1)}
    .item .pic{width:100%;aspect-ratio:4/3;background:var(--bg);overflow:hidden;position:relative}
    .item .pic img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
    .item:hover .pic img{transform:scale(1.05)}
    .item .pic .price{position:absolute;bottom:10px;right:10px;background:var(--accent);color:#fff;padding:5px 12px;border-radius:10px;font-weight:700;font-size:15px}
    .item .pic .loc{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.5);color:#fff;padding:3px 8px;border-radius:6px;font-size:11px}
    .item .pic .tagtop{position:absolute;top:10px;right:10px;background:var(--accent2);color:#fff;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
    .item .info{padding:14px 16px}
    .item .info h3{font-size:15px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .item .info .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
    .item .info .tags span{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--bg);color:var(--text2)}
    .item .info .tags span.gender{color:#e8784a;font-weight:600}
    @keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
    .item:nth-child(1){animation-delay:.03s}.item:nth-child(2){animation-delay:.06s}.item:nth-child(3){animation-delay:.09s}.item:nth-child(4){animation-delay:.12s}.item:nth-child(5){animation-delay:.15s}.item:nth-child(6){animation-delay:.18s}

    .empty{text-align:center;padding:80px 20px;color:var(--text2)}
    .empty .big{font-size:60px;opacity:.3;margin-bottom:12px}
    .foot{text-align:center;padding:24px;color:var(--text2);font-size:12px;border-top:1px solid var(--border);max-width:1200px;margin:0 auto}
    .foot a{color:var(--accent)}

    @media(max-width:640px){
      .list{grid-template-columns:1fr;gap:14px;padding:0 14px 40px}
      .hero{padding:36px 14px 28px}.hero h1{font-size:1.5rem}
      .city-row{gap:4px;padding:10px 12px}
      .city-row select{font-size:12px;padding:6px 8px;min-width:80px}
      .toolbar{padding:0 14px;flex-direction:column;align-items:stretch}
      .acc-bar{right:64px;top:14px}
    }
  </style>
</head>
<body>

<button class="theme-toggle" id="themeBtn" title="切换主题" onclick="toggleTheme()">🌓</button>
<span class="acc-bar" id="accBar"></span>

<header class="hero">
  <h1>🐾 全国宠物交易</h1>
  <p>同城猫咪狗狗 · 免费发布 · 当面交易</p>
  <div class="hero-btns">
    <a href="javascript:;" class="hero-btn buy" onclick="switchType('want')">🔍 我要买宠</a>
    <a href="/publish.html" class="hero-btn sell">📝 我要卖宠</a>
  </div>
  <div class="note">本站仅提供信息撮合，不参与交易。请当面验宠，谨防诈骗</div>
</header>

<div class="city-bar">
  <div class="city-row">
    <span class="lbl">📍</span>
    <select id="selProv" onchange="onProv()"><option value="">全国</option></select>
    <select id="selCity" onchange="onCity()"><option value="">全市</option></select>
    <select id="selDist" onchange="onDist()"><option value="">全区</option></select>
    <span class="locating" id="locateBtn" onclick="locateMe()" title="自动定位到当前位置" style="font-size:12px;color:var(--accent);cursor:pointer;white-space:nowrap">📍 定位</span>
  </div>
</div>

<div class="toolbar">
  <div class="tabs2">
    <div class="t active" id="t_sell" onclick="switchType('sell')">🐾 在售</div>
    <div class="t" id="t_want" onclick="switchType('want')">💬 求购</div>
  </div>
  <input class="search-box" type="text" placeholder="搜品种、城市、价格..." id="si">
</div>
<div class="tag-box" id="tagFilter"><button class="tag-btn active" data-cat="all">全部</button></div>

<div class="list" id="list"></div>
<div class="empty" id="empty" style="display:none"><div class="big">🐾</div><h3>该地区暂无信息</h3><div style="margin-top:8px;color:var(--text2)">切换城市试试，或成为第一个发布的人</div></div>

<div class="foot">
  ⚠ 本站为免费信息发布平台，不参与任何交易。请当面交易、现场验宠，谨防病宠/货不对板。<br>
  禁止发布保护动物，违规者永久封禁。 <a href="/publish.html">免费发布</a>
</div>

<script src="./common.js"></script>
<script>
initCitySelects({ provId:"selProv", cityId:"selCity", distId:"selDist", provPlaceholder:"全国", cityPlaceholder:"全市", distPlaceholder:"全区" });

let pets = [], categories = [];
let curType = "sell";

(async function load() {
  const [r1, r2] = await Promise.all([apiGet("/api/pets?type=sell"), apiGet("/api/categories")]);
  pets = r1.pets || [];
  categories = Array.isArray(r2) ? r2 : [];
  renderCats();
  render(pets);
})();

function renderCats() {
  const fb = document.getElementById("tagFilter");
  fb.innerHTML = '<button class="tag-btn active" data-cat="all">全部</button>';
  categories.forEach(c => {
    const b = document.createElement("button");
    b.className = "tag-btn"; b.dataset.cat = c; b.textContent = c; fb.appendChild(b);
  });
  document.querySelectorAll(".tag-btn").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".tag-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active"); applyFilter();
  }));
}

async function switchType(t) {
  curType = t;
  document.getElementById("t_sell").classList.toggle("active", t === "sell");
  document.getElementById("t_want").classList.toggle("active", t === "want");
  document.getElementById("empty").querySelector("h3").textContent = t === "want" ? "暂无求购信息" : "该地区暂无宠物信息";
  const d = await apiGet("/api/pets?type=" + t);
  pets = d.pets || [];
  applyFilter();
}

function render(list) {
  const box = document.getElementById("list"), emp = document.getElementById("empty");
  box.innerHTML = "";
  if (!list.length) { box.style.display = "none"; emp.style.display = "block"; return; }
  box.style.display = ""; emp.style.display = "none";
  list.forEach((p, i) => {
    const el = document.createElement("div");
    el.className = "item"; el.style.animationDelay = (i * .05) + "s";
    el.onclick = () => location.href = "./detail.html?id=" + encodeURIComponent(p.id);
    const pic = (p.screenshots && p.screenshots[0]) || (p.mainShot || "");
    const loc = (p.province || "") + (p.city || "");
    const price = p.type === "want"
      ? (p.budget ? ("预算¥" + p.budget) : "面议")
      : (p.price ? ("¥" + p.price) : "免费");
    el.innerHTML = `<div class="pic">${pic ? `<img src="${pic}" loading="lazy">` : ""}${price ? `<div class="price">${esc(price)}</div>` : ""}${loc ? `<div class="loc">${esc(loc)}</div>` : ""}${p.type === "want" ? `<div class="tagtop">求购</div>` : ""}</div>
      <div class="info"><h3>${esc(p.name || "未命名")}</h3>
      <div class="tags">
        ${p.breed ? `<span>${esc(p.breed)}</span>` : ""}${p.age ? `<span>${esc(p.age)}</span>` : ""}${p.gender ? `<span class="gender">${esc(p.gender)}</span>` : ""}${p.category ? `<span>${esc(p.category)}</span>` : ""}
      </div></div>`;
    box.appendChild(el);
  });
}

function onProv() { applyFilter(); }
function onCity() { applyFilter(); }
function onDist() { applyFilter(); }
function locateMe() {
  const btn = document.getElementById("locateBtn");
  if (!navigator.geolocation) { alert("浏览器不支持定位"); return; }
  btn.textContent = "⏳ 定位中...";
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const { latitude, longitude } = pos.coords;
      try {
        // 腾讯逆地理编码（免费额度）
        const r = await fetch("https://apis.map.qq.com/ws/geocoder/v1/?location=" + latitude + "," + longitude + "&key=UUXBZ-GMTC3-WZJ3W-YVH2N-OA2FZ-BTZFQ&get_poi=0");
        const data = await r.json();
        if (data && data.result && data.result.address_component) {
          const a = data.result.address_component;
          applyGeoLocation(a.province, a.city || a.province, a.district);
          btn.textContent = "📍 已定位";
          setTimeout(() => btn.textContent = "📍 定位", 3000);
          return;
        }
        btn.textContent = "📍 定位";
        alert("无法解析地址，请手动选择城市");
      } catch (e) {
        btn.textContent = "📍 定位";
        alert("定位服务暂不可用，请手动选择");
      }
    },
    (err) => {
      btn.textContent = "📍 定位";
      alert("定位失败：" + (err.message === "User denied Geolocation" ? "请在浏览器设置中允许定位权限" : err.message));
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 300000 }
  );
}

// 将GPS结果填入省市区下拉框
function applyGeoLocation(prov, city, dist) {
  const ps = document.getElementById("selProv");
  const cs = document.getElementById("selCity");
  const ds = document.getElementById("selDist");

  let matchedProv = prov;
  if (CITY[prov] === undefined && ALIAS_REV[prov]) matchedProv = ALIAS_REV[prov];
  else if (CITY[prov] === undefined && PROV_ALIAS[prov]) matchedProv = PROV_ALIAS[prov];

  if (ps && CITY[matchedProv]) {
    ps.value = matchedProv;
    ps.onchange && ps.onchange();
    setTimeout(() => {
      let matchedCity = city;
      const cityOptions = Array.from(cs.options).map(o => o.value);
      if (!cityOptions.includes(city)) {
        const found = cityOptions.find(c => c.includes(city) || city.includes(c));
        if (found) matchedCity = found;
      }
      if (cs && matchedCity) {
        cs.value = matchedCity;
        cs.onchange && cs.onchange();
        setTimeout(() => {
          if (dist && ds) {
            const distOptions = Array.from(ds.options).map(o => o.value);
            if (distOptions.includes(dist)) ds.value = dist;
            else { const fd = distOptions.find(d => d.includes(dist) || dist.includes(d)); if (fd) ds.value = fd; }
            applyFilter();
          } else { applyFilter(); }
        }, 100);
      } else { applyFilter(); }
    }, 100);
  } else {
    alert("已获取位置：" + prov + " " + city + " " + dist + "，未找到对应选项，请手动选择");
  }
}

function applyFilter() {
  const kw = document.getElementById("si").value.toLowerCase();
  const cat = document.querySelector(".tag-btn.active")?.dataset.cat;
  const pv = document.getElementById("selProv").value, ct = document.getElementById("selCity").value, dt = document.getElementById("selDist").value;
  render(pets.filter(p => {
    if (cat && cat !== "all" && p.category !== cat) return false;
    if (pv && !provMatch(p.province, pv)) return false;
    if (ct && p.city !== ct) return false;
    if (dt && p.district !== dt) return false;
    if (kw) { const s = (p.name + " " + p.breed + " " + p.city + " " + (p.desc || "")).toLowerCase(); if (!s.includes(kw)) return false; }
    return true;
  }));
}
document.getElementById("si").addEventListener("input", applyFilter);
</script>
</body>
</html>

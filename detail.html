<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宠物详情 - 全国宠物交易</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#fdf8f4;--card:#fff;--text:#2d2d2d;--text2:#888;--border:#f0e8e0;--accent:#e8784a;--accent2:#f5a623;--green:#4caf50;--rad:16px}
    [data-theme="dark"]{--bg:#1a1410;--card:rgba(255,255,255,.04);--text:#e8d5c8;--text2:#9a8a7a;--border:rgba(255,255,255,.07);--accent:#f09060;--accent2:#f5b840}
    body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .4s}
    .theme-toggle{position:fixed;top:16px;right:20px;z-index:100;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
    .acc-bar{position:fixed;top:16px;right:70px;z-index:100;display:flex;gap:12px;align-items:center;font-size:13px}
    .acc-link{color:var(--text);text-decoration:none;font-weight:600;padding:6px 10px;border-radius:20px;border:1px solid var(--border);background:var(--card);white-space:nowrap}
    .acc-link:hover{color:var(--accent);border-color:var(--accent)}
    .topbar{position:sticky;top:0;z-index:20;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--border)}
    .back{color:var(--accent);text-decoration:none;font-size:14px;font-weight:600}
    .wrap{max-width:800px;margin:20px auto;padding:0 20px 60px}
    .gallery{margin-bottom:20px;border-radius:var(--rad);overflow:hidden;background:var(--card);border:1px solid var(--border)}
    .gallery .main-img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
    .gallery .thumbs{display:flex;gap:8px;padding:10px;overflow-x:auto}
    .gallery .thumbs img{width:80px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent;opacity:.6;flex-shrink:0;transition:all .2s}
    .gallery .thumbs img.active{border-color:var(--accent);opacity:1}
    .card{background:var(--card);border-radius:var(--rad);padding:20px;border:1px solid var(--border);margin-bottom:16px}
    .card h2{font-size:1.2rem;margin-bottom:14px;font-weight:600;display:flex;align-items:center;gap:8px}
    .attr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
    .attr .kv{display:flex;justify-content:space-between;padding:8px 12px;border-radius:8px;background:var(--bg)}
    .attr .kv .k{color:var(--text2);font-size:13px}
    .attr .kv .v{font-weight:600;font-size:14px;color:var(--accent)}
    .price-big{font-size:2rem;font-weight:700;color:var(--accent);text-align:center;margin:10px 0}
    .desc{line-height:1.7;color:var(--text);font-size:14px}
    .ops{display:flex;gap:10px;margin-top:12px}
    .op-btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;text-align:center;transition:all .2s}
    .op-btn:hover{border-color:var(--accent);color:var(--accent)}
    .op-btn.liked{background:rgba(232,120,74,.1);color:var(--accent);border-color:var(--accent)}
    .op-btn:disabled{opacity:.5;cursor:not-allowed}
    .contact{text-align:center;padding:16px;background:var(--accent);color:#fff;border-radius:12px;font-size:15px;font-weight:600;margin-top:10px;display:block;text-decoration:none}
    .contact:hover{opacity:.9}
    .related{margin-top:20px}
    .related h3{font-size:1rem;margin-bottom:10px;color:var(--text2)}
    .rel-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
    .rel-item{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer}
    .rel-item img{width:100%;aspect-ratio:4/3;object-fit:cover}
    .rel-item .t{padding:8px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .foot{text-align:center;padding:20px;color:var(--text2);font-size:12px}
    .foot a{color:var(--accent)}
    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:24px;font-size:14px;z-index:200;opacity:0;transition:opacity .3s}
    .toast.show{opacity:1}
    @media(max-width:640px){.attr{grid-template-columns:1fr 1fr}.wrap{padding:0 14px 40px}.acc-bar{right:64px;top:14px}}
  </style>
</head>
<body>

<button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌓</button>
<span class="acc-bar" id="accBar"></span>
<div class="topbar"><a class="back" href="./index.html">← 返回列表</a></div>
<div class="wrap" id="wrap"></div>
<div class="foot">⚠ 本站仅提供信息撮合，请当面交易、现场验宠。 <a href="/auth.html">登录/注册</a></div>
<div class="toast" id="toast"></div>

<script src="./common.js"></script>
<script>
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}

const id = new URLSearchParams(location.search).get("id");
const wrap = document.getElementById("wrap");
let curPet = null;

(async function(){ await loadDetail(); })();

async function loadDetail(){
  const d = await apiGet("/api/pets/" + encodeURIComponent(id));
  if(!d.ok || !d.pet){ wrap.innerHTML = '<div class="card" style="text-align:center;padding:60px"><div style="font-size:48px;opacity:.3">🐾</div><h3 style="color:var(--text2);margin-top:12px">未找到该宠物信息</h3><a href="./index.html" style="color:var(--accent);margin-top:8px;display:inline-block">返回列表</a></div>'; return; }
  curPet = d.pet;
  render(curPet);
  // 是否已收藏
  if(isLogin()){ const f = await apiGet("/api/favorites"); if(f.ok && f.favorites.some(x=>x.id===id)){ const b=document.getElementById("likeBtn"); if(b){b.classList.add("liked");b.textContent="❤ 已收藏";} } }
}

function render(p){
  document.title = esc(p.name||"宠物") + " - 全国宠物交易";
  const isWant = p.type === "want";
  const shots = (p.screenshots||[]).slice();
  if(p.mainShot){ const idx=shots.indexOf(p.mainShot); if(idx>0){shots.splice(idx,1);shots.unshift(p.mainShot);} }
  const loc = [p.province,p.city,p.district].filter(Boolean).join(" ");
  const gallery = shots.length ? `<div class="gallery"><img class="main-img" id="mainImg" src="${shots[0]}" alt="主图"><div class="thumbs">${shots.map((s,i)=>`<img src="${s}" class="${i===0?'active':''}" onclick="switchImg(this)" data-full="${s}">`).join("")}</div></div>` : '<div class="gallery"><div class="main-img" style="background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--text2)">暂无图片</div></div>';

  const priceHtml = isWant
    ? (p.budget ? `<div class="price-big">预算 ¥ ${esc(p.budget)}</div>` : `<div class="price-big">预算面议</div>`)
    : (p.price ? `<div class="price-big">¥ ${esc(p.price)}</div>` : "");
  const attrs = [["📍 位置",loc],["🏷 类目",p.category],["🐕 品种",p.breed],["🎂 年龄",p.age],["⚧ 性别",p.gender],["💉 疫苗",p.vaccine],["📅 发布",p.updatedAt?p.updatedAt.slice(0,10):""]].filter(a=>a[1]);
  const attrHtml = attrs.length ? `<div class="attr">${attrs.map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span class="v">${esc(v)}</span></div>`).join("")}</div>` : "";

  wrap.innerHTML = `
    ${gallery}
    <div class="card"><h2>${isWant?'💬 ':'🐾 '}${esc(p.name||"未命名")} ${isWant?'<span class="badge" style="background:var(--accent2);color:#fff;font-size:11px;padding:2px 8px;border-radius:6px;margin-left:6px">求购</span>':''}</h2>${priceHtml}${attrHtml}${p.desc?`<div class="desc" style="margin-top:12px">${esc(p.desc)}</div>`:""}</div>
    <div class="ops">
      ${isWant
        ? `<button class="op-btn" id="apptBtn" onclick="makeAppt()">🤝 我可以提供</button>`
        : `<button class="op-btn" id="likeBtn" onclick="toggleLike()">🤍 收藏</button><button class="op-btn" id="apptBtn" onclick="makeAppt()">📅 预约看宠</button>`}
    </div>
    ${p.contact?`<a class="contact" href="javascript:;" onclick="copyContact('${esc(p.contact)}')">📞 联系${isWant?'发布者':'卖家'}：${esc(p.contact)}（点击复制）</a>`:`<div class="card" style="text-align:center;color:var(--text2)">${isWant?'发布者':'卖家'}未留联系方式</div>`}
    <div class="card" style="background:rgba(245,166,35,.08)"><p style="font-size:13px;color:var(--text2);line-height:1.8">⚠ <b>交易提醒</b>：请当场验宠，确认健康状态后再付款。核对疫苗本、驱虫记录。索要对方身份证照片作为交易凭证。本站不参与任何交易，发生纠纷请自行协商或报警处理。</p></div>
    <div class="related"><h3>🔥 同类推荐</h3><div class="rel-grid" id="relGrid"><div style="color:var(--text2);font-size:13px">加载中...</div></div></div>`;

  loadRelated(p);

  window.switchImg = function(el){ document.getElementById("mainImg").src=el.dataset.full; document.querySelectorAll(".gallery .thumbs img").forEach(i=>i.classList.remove("active")); el.classList.add("active"); };
}

async function loadRelated(p){
  const d = await apiGet("/api/pets?type=" + (p.type||"sell"));
  const rel = (d.pets||[]).filter(x=>x.id!==p.id && (x.city===p.city || x.category===p.category)).slice(0,6);
  const box = document.getElementById("relGrid");
  if(!rel.length){ box.innerHTML='<div style="color:var(--text2);font-size:13px">暂无更多推荐</div>'; return; }
  box.innerHTML = rel.map(x=>`<div class="rel-item" onclick="location.href='./detail.html?id=${encodeURIComponent(x.id)}'"><img src="${x.screenshots&&x.screenshots[0]?x.screenshots[0]:""}" onerror="this.style.display='none'"><div class="t">${esc(x.name||"未命名")}</div></div>`).join("");
}

function copyContact(t){ navigator.clipboard.writeText(t).then(()=>toast("联系方式已复制！")).catch(()=>prompt("手动复制：",t)); }

async function toggleLike(){
  if(!isLogin()){ location.href="/auth.html?redirect="+encodeURIComponent(location.pathname+location.search); return; }
  const b=document.getElementById("likeBtn");
  const liked=b.classList.contains("liked");
  const d = liked ? await apiDel("/api/favorites?petId="+encodeURIComponent(id)) : await apiPost("/api/favorites",{petId:id});
  if(d.ok){ if(liked){b.classList.remove("liked");b.textContent="🤍 收藏";toast("已取消收藏");} else {b.classList.add("liked");b.textContent="❤ 已收藏";toast("收藏成功");} }
  else toast(d.error||"操作失败");
}
async function makeAppt(){
  if(!isLogin()){ location.href="/auth.html?redirect="+encodeURIComponent(location.pathname+location.search); return; }
  const note=prompt("给卖家留言（选填）：","我想看看这只宠物，方便约个时间吗？");
  if(note===null) return;
  const d=await apiPost("/api/appointments",{petId:id,note});
  if(d.ok) toast("预约已发送，等待卖家联系 📨");
  else toast(d.error||"预约失败");
}
</script>
</body>
</html>

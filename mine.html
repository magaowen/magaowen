<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的后台 · 全国宠物交易</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#fdf8f4;--card:#fff;--text:#2d2d2d;--text2:#888;--border:#f0e8e0;--accent:#e8784a;--accent2:#f5a623;--green:#4caf50;--red:#f44336;--rad:14px;--input-bg:#fff}
    [data-theme="dark"]{--bg:#1a1410;--card:rgba(255,255,255,.04);--text:#e8d5c8;--text2:#9a8a7a;--border:rgba(255,255,255,.07);--accent:#f09060;--input-bg:rgba(0,0,0,.4)}
    body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .4s}
    .theme-toggle{position:fixed;top:16px;right:20px;z-index:100;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
    .acc-bar{position:fixed;top:16px;right:70px;z-index:100;display:flex;gap:12px;align-items:center;font-size:13px}
    .acc-link{color:var(--text);text-decoration:none;font-weight:600;padding:6px 10px;border-radius:20px;border:1px solid var(--border);background:var(--card);white-space:nowrap}
    .topbar{position:sticky;top:0;z-index:20;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
    .back{color:var(--accent);text-decoration:none;font-size:14px;font-weight:600}
    .wrap{max-width:760px;margin:20px auto;padding:0 20px 60px}
    .profile{background:linear-gradient(135deg,#f5a623,#e8784a);color:#fff;border-radius:16px;padding:22px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
    .profile .who h2{font-size:1.3rem}
    .profile .who .meta{font-size:13px;opacity:.9;margin-top:4px}
    .profile .acts{display:flex;gap:8px}
    .profile .acts a,.profile .acts button{padding:8px 14px;border-radius:20px;background:rgba(255,255,255,.2);color:#fff;text-decoration:none;font-size:13px;border:1px solid rgba(255,255,255,.4);cursor:pointer;font-family:inherit}
    .profile .acts a:hover,.profile .acts button:hover{background:rgba(255,255,255,.35)}
    .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
    .tab{padding:9px 16px;border-radius:20px;cursor:pointer;background:var(--card);border:1px solid var(--border);color:var(--text2);font-size:14px;font-weight:600}
    .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:22px;margin-bottom:16px}
    .card h3{font-size:1rem;margin-bottom:14px}
    .fld{margin-bottom:12px}.fld label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
    .fld input{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;outline:none}
    .fld input:focus{border-color:var(--accent)}
    .btn{padding:11px 20px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:14px}.btn:hover{opacity:.9}
    .btn-sm{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:12px;cursor:pointer;font-family:inherit}
    .btn-sm.danger{border-color:rgba(244,67,54,.3);color:var(--red)}
    .err{color:var(--red);font-size:13px;margin-top:8px}.ok{color:var(--green);font-size:13px;margin-top:8px}
    .pet-row{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--card)}
    .pet-row .pic{width:60px;height:60px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--bg)}
    .pet-row .info{flex:1;min-width:0}
    .pet-row .info h4{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pet-row .info .sub{font-size:12px;color:var(--text2);margin-top:2px}
    .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;color:#fff;margin-left:6px}
    .empty{text-align:center;color:var(--text2);padding:40px}
    .appt{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--card)}
    .appt .top{display:flex;justify-content:space-between;align-items:center}
    .appt .st{font-size:12px;padding:2px 8px;border-radius:6px;font-weight:600}
    .appt .note{font-size:13px;color:var(--text2);margin-top:8px}
    @media(max-width:640px){.wrap{padding:0 12px 40px}.acc-bar{right:64px}}
  </style>
</head>
<body>
<button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌓</button>
<span class="acc-bar" id="accBar"></span>
<div class="topbar"><a class="back" href="./index.html">← 返回首页</a></div>
<div class="wrap" id="app"><div class="card" style="text-align:center;color:var(--text2);padding:40px">⏳ 加载中...</div></div>

<script src="./common.js"></script>
<script>
(function(){ if(!isLogin()) location.href="/auth.html?redirect=/mine.html"; })();

const u=getUser();
let curTab="profile";

function roleName(t){return t==="seller"?"卖家":t==="admin"?"管理员":"买家";}

function render(){
  document.getElementById("app").innerHTML=`
    <div class="profile">
      <div class="who"><h2>${esc(u.name||u.phone)}</h2><div class="meta">${esc(u.phone)} · ${roleName(u.type)}</div></div>
      <div class="acts">
        ${u.type==="seller"?`<a href="/seller.html">📝 发布中心</a>`:""}
        ${u.type==="admin"?`<a href="/admin.html">🛡️ 后台</a>`:""}
        <button onclick="doLogout()">退出</button>
      </div>
    </div>
    <div class="tabs">
      <div class="tab active" id="tab_profile" onclick="switchTab('profile')">资料设置</div>
      ${u.type==="seller"?`<div class="tab" id="tab_mine" onclick="switchTab('mine')">我的发布</div>`:""}
      <div class="tab" id="tab_fav" onclick="switchTab('fav')">我的收藏</div>
      <div class="tab" id="tab_appt" onclick="switchTab('appt')">我的预约</div>
    </div>
    <div id="panel"></div>`;
  switchTab("profile");
}

function switchTab(t){
  curTab=t;
  ["profile","mine","fav","appt"].forEach(x=>{const el=document.getElementById("tab_"+x);if(el)el.classList.toggle("active",x===t);});
  if(t==="profile") renderProfile();
  else if(t==="mine") renderMine();
  else if(t==="fav") renderFav();
  else if(t==="appt") renderAppt();
}

function renderProfile(){
  document.getElementById("panel").innerHTML=`
    <div class="card">
      <h3>👤 账号资料</h3>
      <div class="fld"><label>昵称</label><input id="p_name" value="${esc(u.name||"")}"></div>
      <button class="btn" onclick="saveName()">保存昵称</button><span class="ok" id="p_ok"></span>
      <hr style="border:none;border-top:1px solid var(--border);margin:18px 0">
      <h3>🔑 修改密码</h3>
      <div class="fld"><label>原密码</label><input id="p_old" type="password"></div>
      <div class="fld"><label>新密码（至少 6 位）</label><input id="p_new" type="password"></div>
      <button class="btn" onclick="savePw()">修改密码</button><span class="err" id="p_err"></span>
    </div>`;
}
async function saveName(){
  const name=document.getElementById("p_name").value.trim();
  const d=await apiPut("/api/auth/me",{name});
  if(d.ok){ u.name=d.user.name; localStorage.setItem("user",JSON.stringify(u)); document.getElementById("p_ok").textContent="✅ 已保存"; setTimeout(()=>location.reload(),500); }
  else alert(d.error||"保存失败");
}
async function savePw(){
  const err=document.getElementById("p_err"); err.textContent="";
  const oldP=document.getElementById("p_old").value, newP=document.getElementById("p_new").value;
  if(!oldP||newP.length<6){err.textContent="请填写原密码，新密码至少6位";return;}
  const d=await apiPut("/api/auth/me",{oldPassword:oldP,newPassword:newP});
  if(d.ok){ clearAuth(); alert("密码已修改，请重新登录"); location.href="/auth.html?redirect=/mine.html"; }
  else err.textContent=d.error||"修改失败";
}

async function renderMine(){
  const box=document.getElementById("panel");
  box.innerHTML='<div class="card"><h3>📦 我的发布</h3><div id="mineBox"><div class="empty">加载中...</div></div></div>';
  const d=await apiGet("/api/pets?mine=1");
  const list=d.pets||[];
  document.getElementById("mineBox").innerHTML = !list.length ? '<div class="empty">还没有发布 <a href="/seller.html" style="color:var(--accent)">去发布</a></div>' :
    list.map(p=>`<div class="pet-row"><img class="pic" src="${p.screenshots&&p.screenshots[0]?p.screenshots[0]:""}" onerror="this.style.visibility='hidden'">
      <div class="info"><h4>${esc(p.name||"未命名")}<span class="badge" style="background:${STATUS_COLOR[p.status]||'#888'}">${STATUS_LABEL[p.status]||p.status}</span></h4>
      <div class="sub">${esc([p.province,p.city].filter(Boolean).join(" "))} · ${p.price?"¥"+esc(p.price):"免费"}</div>
      ${p.status==="rejected"?`<div class="sub" style="color:var(--red)">${esc(p.rejectReason||"")}</div>`:""}</div>
      <div class="ops">${p.status==="active"?`<button class="btn-sm danger" onclick="unpub('${p.id}')">下架</button>`:""}<button class="btn-sm danger" onclick="del('${p.id}')">删除</button></div></div>`).join("");
}
async function unpub(id){ if(!confirm("确认下架？"))return; const d=await apiPost("/api/pets/"+encodeURIComponent(id)+"/unpublish",{}); if(d.ok) renderMine(); else alert(d.error); }
async function del(id){ if(!confirm("确认删除？不可恢复"))return; const d=await apiDel("/api/pets/"+encodeURIComponent(id)); if(d.ok) renderMine(); else alert(d.error); }

async function renderFav(){
  const box=document.getElementById("panel");
  box.innerHTML='<div class="card"><h3>❤ 我的收藏</h3><div id="favBox"><div class="empty">加载中...</div></div></div>';
  const d=await apiGet("/api/favorites");
  const list=d.favorites||[];
  document.getElementById("favBox").innerHTML = !list.length ? '<div class="empty">还没有收藏，去 <a href="/" style="color:var(--accent)">首页</a> 逛逛吧</div>' :
    list.map(p=>`<div class="pet-row" onclick="location.href='./detail.html?id=${encodeURIComponent(p.id)}'" style="cursor:pointer"><img class="pic" src="${p.screenshots&&p.screenshots[0]?p.screenshots[0]:""}" onerror="this.style.visibility='hidden'">
      <div class="info"><h4>${esc(p.name||"未命名")}</h4><div class="sub">${esc([p.province,p.city].filter(Boolean).join(" "))} · ${p.price?"¥"+esc(p.price):"免费"}</div></div>
      <button class="btn-sm danger" onclick="event.stopPropagation();unfav('${p.id}')">取消</button></div>`).join("");
}
async function unfav(id){ const d=await apiDel("/api/favorites?petId="+encodeURIComponent(id)); if(d.ok) renderFav(); else alert(d.error); }

async function renderAppt(){
  const box=document.getElementById("panel");
  box.innerHTML='<div class="card"><h3>📅 我的预约</h3><div id="apptBox"><div class="empty">加载中...</div></div></div>';
  const d=await apiGet("/api/appointments");
  const list=d.appointments||[];
  const stColor={pending:"#f5a623",accepted:"#4caf50",rejected:"#f44336",cancelled:"#888"};
  document.getElementById("apptBox").innerHTML = !list.length ? '<div class="empty">还没有预约，去宠物详情页点「预约看宠」吧</div>' :
    list.map(a=>`<div class="appt"><div class="top"><b>${esc(a.pet?a.pet.name:"已下架宠物")}</b><span class="st" style="background:${stColor[a.status]||'#888'};color:#fff">${({pending:"待回复",accepted:"已接受",rejected:"已拒绝",cancelled:"已取消"}[a.status]||a.status)}</span></div>
      <div class="sub" style="font-size:12px;color:var(--text2);margin-top:4px">${esc([a.pet&&a.pet.province,a.pet&&a.pet.city].filter(Boolean).join(" "))}</div>
      ${a.note?`<div class="note">留言：${esc(a.note)}</div>`:""}</div>`).join("");
}

render();
</script>
</body>
</html>

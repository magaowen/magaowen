<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布宠物 · 全国宠物交易</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#fdf8f4;--card:#fff;--text:#2d2d2d;--text2:#888;--border:#f0e8e0;--accent:#e8784a;--accent2:#f5a623;--green:#4caf50;--red:#f44336;--rad:14px;--input-bg:#fff}
    [data-theme="dark"]{--bg:#1a1410;--card:rgba(255,255,255,.04);--text:#e8d5c8;--text2:#9a8a7a;--border:rgba(255,255,255,.07);--accent:#f09060;--accent2:#f5b840;--input-bg:rgba(0,0,0,.4)}
    body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .4s}
    .theme-toggle{position:fixed;top:16px;right:20px;z-index:100;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
    .topbar{position:sticky;top:0;z-index:20;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--border)}
    .back{color:var(--accent);text-decoration:none;font-size:14px;font-weight:600}
    .wrap{max-width:640px;margin:20px auto;padding:0 20px 60px}
    .hdr{text-align:center;padding:30px 0 10px}
    .hdr h1{font-size:1.4rem;font-weight:700}
    .hdr p{color:var(--text2);font-size:13px;margin-top:6px}

    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:24px;margin-bottom:16px}
    .fld{margin-bottom:12px}
    .fld label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
    .fld input,.fld textarea,.fld select{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;outline:none;font-family:inherit}
    .fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--accent)}
    .fld textarea{resize:vertical;min-height:70px}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 .fld{margin-bottom:0}
    .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end}.g3 .fld{margin-bottom:0}
    .rad{display:flex;gap:16px;padding:8px 0}.rad label{cursor:pointer;display:flex;align-items:center;gap:4px}
    .hint{font-size:11px;color:var(--text2);margin-top:4px}
    .btn{width:100%;padding:13px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;margin-top:8px}.btn:hover{opacity:.9;transform:scale(1.02)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .err{color:var(--red);font-size:13px;margin-top:8px;text-align:center}
    .ok{color:var(--green);font-size:13px;margin-top:8px;text-align:center}

    .shots-wrap{display:flex;flex-direction:column;gap:6px;margin-top:6px}
    .shot-row{display:grid;grid-template-columns:50px 1fr 28px;gap:6px;align-items:center;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:6px}
    .shot-row .thumb{width:42px;height:42px;border-radius:6px;background:var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text2)}
    .shot-row .thumb img{width:100%;height:100%;object-fit:cover}
    .shot-row input{font-size:13px;padding:7px}
    .shot-row .del-btn{cursor:pointer;background:rgba(244,67,54,.1);border:none;color:var(--red);border-radius:6px;padding:5px;font-size:12px}
    .add-btn{margin-top:6px;padding:9px;border:1px dashed var(--border);border-radius:9px;background:transparent;color:var(--text2);cursor:pointer;width:100%;font-family:inherit;font-size:13px}
    .add-btn:hover{border-color:var(--accent)}
    .rule{font-size:12px;color:var(--text2);line-height:1.8;padding:16px;background:var(--bg);border-radius:10px;margin-top:12px}

    @media(max-width:640px){.g2,.g3{grid-template-columns:1fr}.wrap{padding:0 12px 40px}}
  </style>
</head>
<body>

<button class="theme-toggle" id="themeBtn" title="切换主题">🌓</button>
<div class="topbar"><a class="back" href="./index.html">← 返回首页</a></div>
<div class="wrap">
  <div class="hdr"><h1>📝 发布宠物</h1><p>免费发布，审核通过后前台展示</p></div>

  <div class="card">
    <div class="fld"><label>标题 *</label><input id="t_name" placeholder="如：布偶猫找新家 / 柯基幼犬出售"></div>
    <div class="g2">
      <div class="fld"><label>省份 *</label><select id="t_prov" onchange="onProv()"><option value="">请选择</option></select></div>
      <div class="fld"><label>城市 *</label><select id="t_city"><option value="">请选择</option></select></div>
    </div>
    <div class="g2">
      <div class="fld"><label>区县</label><input id="t_dist" placeholder="如：大理市 / 古城区"></div>
      <div class="fld"><label>分类 *</label><select id="t_cat"><option value="">加载中...</option></select></div>
    </div>
    <div class="g2">
      <div class="fld"><label>品种</label><input id="t_breed" placeholder="如：布偶猫 / 金毛"></div>
      <div class="fld"><label>年龄</label><input id="t_age" placeholder="如：3个月 / 1岁"></div>
    </div>
    <div class="g3">
      <div class="fld"><label>性别</label>
        <div class="rad"><label><input type="radio" name="t_gender" value="公 🚹" checked> 公</label><label><input type="radio" name="t_gender" value="母 🚺"> 母</label><label><input type="radio" name="t_gender" value="未知"> 未知</label></div>
      </div>
      <div class="fld"><label>疫苗</label><input id="t_vaccine" placeholder="如：已打两针"></div>
      <div class="fld"><label>价格 ¥</label><input id="t_price" type="number" placeholder="0=免费领养" value="0"></div>
    </div>
    <div class="fld"><label>联系方式 *</label><input id="t_contact" placeholder="微信 / 手机号（买家联系你）"></div>
    <div class="fld"><label>详细描述</label><textarea id="t_desc" placeholder="宠物性格、健康、送养原因..."></textarea></div>

    <div class="fld">
      <label>宠物照片（首张为主图）</label>
      <div class="shots-wrap" id="t_shots"></div>
      <button class="add-btn" onclick="addShot()">+ 添加照片</button>
    </div>

    <div class="rule">
      ⚠ <b>发布规则</b><br>
      1. 禁止发布国家保护动物<br>
      2. 请上传真实照片，虚假信息将被删除<br>
      3. 本站仅提供信息撮合，交易请当面验宠<br>
      4. 联系方式务必真实，方便买家联系你
    </div>

    <button class="btn" id="submitBtn" onclick="doSubmit()">📤 免费发布</button>
    <div class="err" id="msgErr"></div>
    <div class="ok" id="msgOk"></div>
  </div>
</div>

<script>
(function(){const s=localStorage.getItem("theme")||"light";document.documentElement.setAttribute("data-theme",s);document.getElementById("themeBtn").textContent=s==="dark"?"☀️":"🌙"})();
document.getElementById("themeBtn").onclick=()=>{const n=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",n);localStorage.setItem("theme",n);document.getElementById("themeBtn").textContent=n==="dark"?"☀️":"🌙"};
function esc(s){return String(s==null?"":s).replace(/[<>&"']/g,c=({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c]))}

const CITY={北京:["北京市"],上海:["上海市"],天津:["天津市"],重庆:["重庆市"],广东:["广州","深圳","东莞","佛山","珠海","中山","惠州","汕头","江门","湛江","茂名","肇庆","揭阳","清远","韶关","河源","阳江","云浮","梅州","汕尾","潮州"],江苏:["南京","苏州","无锡","常州","南通","徐州","扬州","镇江","盐城","泰州","淮安","连云港","宿迁"],浙江:["杭州","宁波","温州","嘉兴","湖州","绍兴","金华","台州","衢州","丽水","舟山"],山东:["济南","青岛","烟台","潍坊","临沂","淄博","济宁","泰安","威海","日照","德州","聊城","滨州","菏泽","枣庄"],四川:["成都","绵阳","德阳","宜宾","南充","泸州","乐山","达州","广元","内江","自贡","攀枝花","遂宁","眉山","资阳","雅安","凉山","广安","巴中"],湖北:["武汉","宜昌","襄阳","荆州","黄冈","十堰","孝感","恩施","鄂州","黄石","咸宁","荆门","随州"],湖南:["长沙","株洲","湘潭","衡阳","岳阳","常德","郴州","怀化","永州","邵阳","益阳","娄底","湘西","张家界"],河南:["郑州","洛阳","南阳","许昌","新乡","周口","商丘","信阳","开封","驻马店","平顶山","安阳","焦作","濮阳","漯河","三门峡"],福建:["福州","厦门","泉州","漳州","莆田","龙岩","三明","宁德","南平"],河北:["石家庄","唐山","邯郸","保定","沧州","邢台","廊坊","秦皇岛","张家口","衡水","承德"],安徽:["合肥","芜湖","马鞍山","蚌埠","安庆","滁州","阜阳","六安","亳州","淮南","淮北","铜陵","宣城","黄山","池州","宿州"],辽宁:["沈阳","大连","鞍山","抚顺","本溪","锦州","营口","阜新","辽阳","盘锦","铁岭","朝阳","丹东"],江西:["南昌","九江","赣州","上饶","宜春","吉安","抚州","景德镇","萍乡","新余","鹰潭"],陕西:["西安","咸阳","宝鸡","渭南","汉中","延安","榆林","安康","商洛"],广西:["南宁","柳州","桂林","玉林","北海","梧州","钦州","百色","河池","贵港"],云南:["昆明","大理","丽江","曲靖","玉溪","昭通","普洱","保山","临沧","红河","文山","西双版纳","楚雄","德宏"],贵州:["贵阳","遵义","毕节","六盘水","安顺","铜仁","黔东南","黔南","黔西南"],山西:["太原","大同","临汾","运城","长治","晋中","阳泉","晋城","忻州","朔州","吕梁"],吉林:["长春","吉林","四平","通化","延边","白城","松原","辽源"],黑龙江:["哈尔滨","大庆","齐齐哈尔","牡丹江","佳木斯","鸡西","鹤岗","双鸭山","绥化"],内蒙古:["呼和浩特","包头","鄂尔多斯","赤峰","通辽","呼伦贝尔","乌兰察布","巴彦淖尔","乌海"],甘肃:["兰州","天水","酒泉","庆阳","白银","武威","张掖","平凉"],新疆:["乌鲁木齐","克拉玛依","库尔勒","昌吉","石河子","伊犁","阿克苏","喀什"],海南:["海口","三亚","儋州","琼海"],宁夏:["银川","吴忠","石嘴山","中卫"],青海:["西宁","海东","格尔木"],西藏:["拉萨","日喀则","林芝"],香港:["香港"],澳门:["澳门"],台湾:["台北","高雄","台中","台南"]};
(function(){const s=document.getElementById("t_prov");Object.keys(CITY).forEach(p=>s.add(new Option(p,p)));fetch("/api/categories").then(r=>r.json()).then(cats=>{const s=document.getElementById("t_cat");s.innerHTML='<option value="">请选择</option>';cats.forEach(c=>s.add(new Option(c,c)))}).catch(()=>{})})();
function onProv(){const pv=document.getElementById("t_prov").value,cc=document.getElementById("t_city");cc.innerHTML='<option value="">请选择</option>';if(pv&&CITY[pv])CITY[pv].forEach(c=>cc.add(new Option(c,c)))}

let sp=[{url:"",isMain:true}];
function addShot(u="",m=false){sp.push({url:u,isMain:m});rSp()}
function rSp(){const b=document.getElementById("t_shots");b.innerHTML=sp.map((s,i)=>`<div class="shot-row"><div class="thumb">${s.url&&/^(data:|https?:)/i.test(s.url)?`<img src="${s.url}">`:"?"}</div><input type="text" placeholder="粘贴图片URL" value="${esc(s.url.startsWith("data:")?"[已上传]":s.url)}" onchange="upSp(${i},this.value)"><input type="file" accept="image/*" onchange="upSpF(${i},this)" style="font-size:10px;padding:2px"><button class="del-btn" onclick="delSp(${i})">×</button></div>`).join("")}
function upSp(i,v){sp[i].url=v.trim();rSp()}
function delSp(i){if(sp.length<=1)return;sp.splice(i,1);rSp()}
function upSpF(i,inp){const f=inp.files[0];if(!f)return;(function cpr(f,mw,mh,mx){return new Promise((ok,no)=>{const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>mw){h=h*mw/w;w=mw}if(h>mh){w=w*mh/h;h=mh}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);let q=.85,b64;(function qq(){b64=c.toDataURL("image/jpeg",q);if(b64.length*3/4>mx&&q>.3){q-=.1;qq()}else ok(b64)})()};img.onerror=()=>no(new Error("格式"));img.src=e.target.result};r.onerror=()=>no(new Error("读取"));r.readAsDataURL(f)})})(f,800,800,200*1024).then(b64=>{sp[i].url=b64;rSp()}).catch(e=>alert(e.message))}

async function doSubmit(){
  const btn=document.getElementById("submitBtn"),me=document.getElementById("msgErr"),mo=document.getElementById("msgOk");
  me.textContent="";mo.textContent="";btn.disabled=true;btn.textContent="提交中...";
  const name=document.getElementById("t_name").value.trim(),pv=document.getElementById("t_prov").value,ct=document.getElementById("t_city").value;
  if(!name||!pv||!ct){me.textContent="请填写标题、省份、城市";btn.disabled=false;btn.textContent="📤 免费发布";return}
  const gender=[...document.getElementsByName("t_gender")].find(r=>r.checked)?.value||"";
  const valid=sp.filter(s=>s.url&&!s.url.startsWith("[已上传]")&&s.url.trim()!=="");
  const sw={id:"p"+Date.now(),name,icon:"🐾",province:pv,city:ct,district:document.getElementById("t_dist").value.trim(),category:document.getElementById("t_cat").value,breed:document.getElementById("t_breed").value.trim(),age:document.getElementById("t_age").value.trim(),gender,vaccine:document.getElementById("t_vaccine").value.trim(),price:document.getElementById("t_price").value.trim(),contact:document.getElementById("t_contact").value.trim(),desc:document.getElementById("t_desc").value.trim(),updated:new Date().toISOString().slice(0,10),screenshots:valid.map(s=>s.url),mainShot:null};
  try{
    const r=await fetch("/api/softwares",{method:"POST",headers:{"content-type":"application/json","x-admin-pass":"123456"},body:JSON.stringify({software:sw})});
    const d=await r.json();
    if(d.ok){mo.textContent="✅ 发布成功！即将跳转首页...";setTimeout(()=>location.href="/",1500)}else me.textContent="发布失败："+(d.error||"")
  }catch(e){me.textContent="网络错误："+e.message}
  btn.disabled=false;btn.textContent="📤 免费发布";
}
rSp();
</script>
</body>
</html>
